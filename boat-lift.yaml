# =============================================================================
#  UltraLift Auto — Boat Lift Automation
#  HydroHoist UltraLift UL2 8800  ·  KinCony KC868-A16 (ESP32)
#  Design: docs/boat_lift_design.md  ·  Decisions: docs/adr.md
#
#  TWO-VALVE / TWO-IMU AUTO-LEVELING:
#    · one vent/fill valve per tank: valve A (master side, Y2) + valve B (slave
#      side, Y3); per-tank plumbing with check-valved blower tee (NO shared
#      open manifold)
#    · IMU #1 (GPIO32) = STARBOARD, primary height. IMU #2 (GPIO14) = PORT.
#      Either side can run go-to if the other is untrusted (ADR-017). Leveling
#      still needs both. Port is the height source only while starboard is out.
#    · level error = slave height % − master height % (each side has its OWN
#      captures, so frame racking is calibrated out); while moving, the
#      side that is AHEAD gets its valve throttled shut until the other catches up
#    · hard stop / failed correction: list past Tilt Critical or a pulse that
#      is not shrinking => emergency descent if the boat is high (ADR-015)
#    · Maintain Level switch OFF => valves ganged, decisions logged as
#      LEVEL(shadow) (observe-first, like height-maintain with actuation off)
#
#  STATE LEGEND (global lift_state — named ${S_*} in substitutions):
#     0 = HOLD           blower OFF, valves CLOSED  (make_safe)
#     1 = (retired)      was RAISING_VALVE_OPENING; slot kept reserved.
#                         Blower + valves start together — no sequencing interlock.
#     2 = RAISING        blower ON,  valves OPEN (minus the leveling throttle)
#     3 = LOWERING       blower OFF, valves OPEN (minus the leveling throttle)
#     4 = FAULT          blower OFF, valves CLOSED  (latched + reason)
#     5 = BYPASS         blower OFF, valves OPEN    (manual override: vent & hold hands-off;
#                         position LEDs off, red flashes)
#     6 = LOWERED_VENT   blower OFF, valves OPEN    (resting at Lowered: vent stays
#                         open so the lift keeps settling; commands accepted.
#                         Automatic re-entry waits for ADR-018 IMU settle and
#                         both sides in the Lowered zone — a power-up frame
#                         must not open the valves.)
#     7 = EMERG_DESCEND  blower OFF, valves OPEN    (correction failed or list
#                         > Tilt Critical with the boat high: vent BOTH sides
#                         to Ready; seal if list collapsed, else continue to
#                         Lowered. Stop = seal now. ADR-015)
#
#  KC868-A16 I/O:
#     I2C GPIO4/5 · inputs 0x22 (X01-08) 0x21 (X09-16)
#                 · outputs 0x24 (Y01-08) 0x25 (Y09-16)
#     RS485 UART  GPIO13(TX)/GPIO16(RX) @ 9600 (panel link)
#     IMU #2      GPIO14 (HT3, UART0) @ 9600 — slave WT901, RX only
# =============================================================================

substitutions:
  device_name: "boat-lift"
  friendly_name: "Boat Lift"

  # ---- physical side labels (dock terms) ----
  # IMU #1 (master, HT1/GPIO32) = STARBOARD. IMU #2 (slave, HT3/GPIO14) = PORT.
  # Valve A (Y2) = starboard tank, valve B (Y3) = port tank.
  # Leveling requires valve A = master IMU's side; if plumbing differs, swap the
  # valve output pins AND feedback pin pairs below.
  side_master: "Starboard"
  side_slave: "Port"

  # ---- lift geometry ----
  arm_length_in: "51.0"   # pivot arm 4 ft 3 in — drives the display-only Bunk Height
  bunk_lowered_waterline_in: "-13.0"  # measured bunk height at true Lowered; negative = below water

  # ---- FSM state codes (global lift_state). Named so lambdas read as prose.
  #      Values are FROZEN; slot 1 is retired but reserved. ----
  S_HOLD: "0"
  S_RAISING: "2"
  S_LOWERING: "3"
  S_FAULT: "4"
  S_BYPASS: "5"
  S_LOWERED_VENT: "6"
  S_EMERG: "7"      # emergency descent (ADR-015): Ready first, maybe Lowered
  # ---- go-to mode codes (global goto_mode) ----
  M_LIFT: "0"       # stored position — boat ceiling or empty ceiling (§5.1)
  M_READY: "1"      # almost down, not yet floating
  M_LOWER: "2"      # all the way down (boat floats free)
  M_MAX: "3"        # retired — Lift Max is no longer a mode (slot kept)
  M_GUIDE: "4"      # floating, bunks still a slip centerline (sealed rest)
  M_HEIGHT: "5"     # one-shot bunk-inch target; not a parked mode

  # ---- Output channel numbers on PCF8574 outputs_1_8 (0x24), pins 0-7 ----
  blower_out_pin: "0"        # Y01 -> blower relay coil (RIB2401B / NT90)
  valve_power_out_pin: "1"   # Y02 -> valve A (MASTER tank) power/open (auto-return: OFF = closed, ON = open)
  valve_b_out_pin: "2"       # Y03 -> valve B (SLAVE tank)  power/open (auto-return: OFF = closed, ON = open)
  led_top_pin: "3"           # Y04 -> Top button ring LED     (white)  CONFIRMED
  led_ready_pin: "4"         # Y05 -> Ready button ring LED   (orange) CONFIRMED
  led_stop_pin: "5"          # Y06 -> Stop button ring LED    (red)    CONFIRMED
  led_lowered_pin: "6"       # Y07 -> Lowered button ring LED (green)  CONFIRMED

  # ---- Input channel numbers on PCF8574 inputs_9_16 (0x21), pins 0-7 = DI9-16 ----
  #   CONFIRMED at the panel by colour: red=Stop=DI12, white=Top=DI13, green=Lowered=DI16.
  #   Ready (orange) MOVED off DI15 -> DI11: the X15 input channel was not registering
  #   presses (wiring/board fault); X11 is the next free input. Move the wire to X11.
  btn_stop_in_pin: "3"       # DI12 (X12) -> Stop button    (red)    CONFIRMED
  btn_top_in_pin: "4"        # DI13 (X13) -> Top button     (white)  CONFIRMED
  btn_ready_in_pin: "2"      # DI11 (X11) -> Ready button   (orange) MOVED from DI15 (bad channel)
  btn_lowered_in_pin: "7"    # DI16 (X16) -> Lowered button (green)  CONFIRMED

  # ---- Valve position feedback (CR502 5-wire) on PCF8574 inputs_1_8 (0x22), pins 0-7 = DI1-8 ----
  #   Maintained aux contacts, common = WHITE -> DI GND/COM (NOT an input channel).
  #   Green = FULLY OPEN, Yellow = FULLY CLOSED. Contact-closed at the limit -> inverted:true reads ON.
  valve_open_fb_pin: "1"     # X02 (DI2) -> GREEN  (valve A FULLY OPEN feedback)
  valve_closed_fb_pin: "0"   # X01 (DI1) -> YELLOW (valve A FULLY CLOSED feedback)
  # Valve B (slave tank) CR5-02 aux contacts on the next free inputs, same
  # block, same colour convention. Common (white) -> same DI GND/COM screw.
  valve_b_open_fb_pin: "3"   # X04 (DI4) -> GREEN  (valve B FULLY OPEN feedback)
  valve_b_closed_fb_pin: "2" # X03 (DI3) -> YELLOW (valve B FULLY CLOSED feedback)

  ds18b20_gpio: "GPIO33"     # CONFIRMED: GPIO terminal "2" on the A16 = GPIO33

  # ---- Dock button wiring (DMWD 19mm illuminated, confirmed on the bench) ----
  #   Switch NO contact = YELLOW + WHITE (open at rest, closes on press -> reads ON)
  #   Spare NC contact  = GREEN (unused)
  #   LED ring          = RED (+) / BLACK (-), ~12V (built-in resistor)

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "HydroHoist UL2 8800 boat lift controller: 2 valves + 2 IMUs auto-level"
  build_path: .esphome/build/boat-lift
  includes:
    - cover_position.h
    - boot_settle.h
  project:
    name: ultralift.boat_lift
    version: "0.11.4 (2026-10-08)"  # power-up must not vent; IMU settle gate (ADR-018)

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# ---------------------------------------------------------------------------
#  Connectivity — telemetry / UI ONLY. No safety logic depends on this.
# ---------------------------------------------------------------------------
wifi:
  id: wifi_sta
  networks:
    - ssid: !secret wifi_ssid_1
      password: !secret wifi_password_1
  ap:
    ssid: ${device_name}
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 3
  local: false
  js_url: ""
  css_url: ""
  js_include: web/dashboard.js
  css_include: web/dashboard.css
  log: false
  # Page layout: entities are filed into these groups (top -> bottom) via
  # web_server.sorting_group_id on each entity. 1 Control / 2 Status /
  # 3 Config (calibration + everyday knobs) / 4 Advanced Tuning (set-and-forget,
  # live-editable + persisted) / 5 Diagnostics (read-only) / 6 Bench (hands-on
  # wiring + manual override).
  sorting_groups:
    - id: group_control
      name: "1 · Control"
      sorting_weight: 10
    - id: group_status
      name: "2 · Status"
      sorting_weight: 20
    - id: group_config
      name: "3 · Configuration"
      sorting_weight: 30
    - id: group_advanced
      name: "4 · Advanced Tuning"
      sorting_weight: 35
    - id: group_diag
      name: "5 · Diagnostics"
      sorting_weight: 40
    - id: group_bench
      name: "6 · Bench / Wiring Test"
      sorting_weight: 50

logger:
  level: INFO
  baud_rate: 0     # serial logging OFF: UART0 is repurposed for IMU #2 (GPIO14).
                   # Logs still stream via API/web/`esphome logs` over WiFi.

time:
  - platform: sntp
    id: sntp_time
    timezone: America/Winnipeg

# ---------------------------------------------------------------------------
#  Buses
# ---------------------------------------------------------------------------
i2c:
  sda: 4
  scl: 5
  scan: true
  id: bus_a

pcf8574:
  - id: inputs_1_8
    address: 0x22
    pcf8575: false
  - id: inputs_9_16
    address: 0x21
    pcf8575: false
  - id: outputs_1_8
    address: 0x24
    pcf8575: false
  - id: outputs_9_16
    address: 0x25
    pcf8575: false

# WT901BC-TTL angle sensor — native WIT protocol (0x55-framed), READ-ONLY on GPIO32.
# (Replaces the earlier RS485/Modbus path: this unit is TTL, not RS485. Sensor TX -> GPIO32,
#  VCC -> 12V, GND shared. GPIO32 is 3.3V-only; add a divider if the sensor TX is 5V.)
uart:
  - id: wit_uart
    rx_pin: GPIO32
    baud_rate: 9600
    rx_buffer_size: 512

  # IMU #2 (SLAVE, far tank) — same WT901 TTL protocol, READ-ONLY on GPIO14 (HT3
  # terminal). Uses UART0 (freed by logger baud_rate: 0). 3.3V TTL: bench-test at
  # the installed cable length; shielded twisted pair, away from blower AC.
  - id: wit2_uart
    rx_pin: GPIO14
    baud_rate: 9600
    rx_buffer_size: 512

  # Panel link — RS485 to the touch panel (auto-direction transceiver, no DE pin).
  # See boat_lift_link_protocol.md. Telemetry/intents only; no safety logic here.
  - id: link_uart
    tx_pin: GPIO13
    rx_pin: GPIO16
    baud_rate: 9600

one_wire:
  - platform: gpio
    pin: ${ds18b20_gpio}

# ---------------------------------------------------------------------------
#  State + persistent calibration + scratch globals
# ---------------------------------------------------------------------------
globals:
  # HA display latch only; never restored or used by motion/maintenance logic.
  - id: cover_fully_raised
    type: bool
    restore_value: no
    initial_value: "false"
  # ---- live state (not persisted: always boot to HOLD) ----
  - id: lift_state
    type: int
    restore_value: no
    initial_value: "0"
  - id: fault_reason
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: test_mode
    type: bool
    restore_value: no
    initial_value: "false"

  # ---- angle tracking ----
  - id: current_angle
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: angle_last_update
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: angle_valid
    type: bool
    restore_value: no
    initial_value: "false"
  - id: angle_trusted          # valid AND positionally plausible (in calibrated range)
    type: bool
    restore_value: no
    initial_value: "false"
  - id: manual_move            # current move is a manual jog (not position-targeted)
    type: bool
    restore_value: no
    initial_value: "false"
  - id: user_cmd_move          # current move was asked for by a person (dock/panel/web/HA)
    type: bool                 # — not the auto-maintain keeper or emergency descent.
    restore_value: no          # Drives "Lift In Operation" + the HA command dropdown.
    initial_value: "false"
  # ---- raw decoded angle axes from the WT901 0x53 frame ----
  - id: angle_roll
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: angle_pitch
    type: float
    restore_value: no
    initial_value: "0.0"

  # ---- IMU #2 (SLAVE) tracking — mirrors the master's angle globals ----
  - id: current_angle2
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: angle2_roll
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: angle2_pitch
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: angle2_last_update
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: angle2_valid
    type: bool
    restore_value: no
    initial_value: "false"
  - id: angle2_trusted
    type: bool
    restore_value: no
    initial_value: "false"
  # Height authority (ADR-017). angle_trusted stays starboard-only.
  # height_src: 0 = neither, 1 = starboard, 2 = port fallback.
  - id: height_ok
    type: bool
    restore_value: no
    initial_value: "false"
  - id: height_src
    type: int
    restore_value: no
    initial_value: "0"
  - id: height_angle
    type: float
    restore_value: no
    initial_value: "0.0"

  # ---- leveling scratch ----
  - id: level_ok_now           # both IMUs trusted + both sides calibrated
    type: bool
    restore_value: no
    initial_value: "false"
  - id: level_err_filt         # EMA of (slave% - master%); + = slave side HIGH
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: level_ok_since         # millis when dual-IMU trust last became true (0 = not trusted)
    type: unsigned long        # ADR-018 settle clock; not an 8 s hard-stop arm
    restore_value: no          # a restored uptime would arm the gate immediately
    initial_value: "0"
  - id: level_calm_since       # millis when |list| last fell under Tilt Critical (0 = not calm)
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: level_settle_vent      # boot_settle: lowered-vent re-entry and rest-level may run
    type: bool
    restore_value: no
    initial_value: "false"
  - id: level_settle_hard      # boot_settle: level hard stop / automatic descent may run
    type: bool
    restore_value: no
    initial_value: "false"
  - id: lowered_absent_since   # millis both IMUs first read "not lowered" while venting (0 = a side is down)
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: level_throttle         # 0 = none, 1 = master valve closed, 2 = slave valve closed
    type: int
    restore_value: no
    initial_value: "0"
  - id: level_since            # millis of last throttle decision change (min-hold)
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: level_shadow_want      # last logged shadow decision (dedupe logging)
    type: int
    restore_value: no
    initial_value: "0"
  - id: level_catchup_start    # master at target, waiting on slave (0 = not waiting)
    type: unsigned long
    restore_value: no
    initial_value: "0"
  # ---- §21.6 at-rest level keeper (Lift only; gated by Maintain Level) ----
  # rest_pulse: 0=off, 1=feed master, 2=feed slave, 3=vent slave, 4=vent master
  - id: rest_pulse
    type: int
    restore_value: no
    initial_value: "0"
  - id: rest_pulse_since
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: rest_level_below_since   # level error past trigger (0 = not past)
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: rest_pulse_start_angle   # progress check on the side being fed/vented
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: rest_pulse_air_since     # when the feed/vent valve is actually open (0 = not yet)
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: rest_pulse_err_at_air    # level_err_filt snapshot when air started
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: rest_last_pulse_ms       # min gap between rest-level pulses
    type: unsigned long
    restore_value: no
    initial_value: "0"
  # ADR-015: emergency descent arrived at Lowered with residual list — vents
  # stay open (LOWERED_VENT) but Lift Problem stays ON and mode buttons refuse
  # until Stop acknowledges into FAULT + seal.
  - id: emerg_lock
    type: bool
    restore_value: no
    initial_value: "false"
  - id: emerg_ready_since        # first tick in the Ready band during EMERG (0 = not there)
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: emerg_ready_err          # level_err_filt snapshot at Ready arrival
    type: float
    restore_value: no
    initial_value: "0.0"

  # ---- timers / progress trackers ----
  - id: blower_on_since
    type: unsigned long
    restore_value: no
    initial_value: "0"
  # absolute blower-runtime cap tracking (works in ALL modes, incl. manual test)
  - id: blower_run_since
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: blower_was_on
    type: bool
    restore_value: no
    initial_value: "false"
  - id: last_progress_angle
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: last_progress_time
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: lower_start_time
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: last_stop_reason         # why the last move ended (diagnostic text sensor)
    type: std::string
    restore_value: no
    initial_value: '""'
  # go-to-position target: where a move is heading, and which mode (0=Lift,1=Ready,2=Lower)
  - id: goto_target_pct
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: goto_mode
    type: int
    restore_value: no
    initial_value: "0"
  # Lift shutoff % — boat ceiling (Lift Target % of cal_up) or empty ceiling
  # (same fraction of cal_max). Fail-safe: unknown / any boat → boat ceiling.
  - id: lift_shutoff_pct
    type: float
    restore_value: no
    initial_value: "NAN"
  # Stop must be able to seal the valves even while parked in LOWERED_VENT.
  # Cleared by the next accepted position request (including another Lower press).
  - id: lowered_vent_stopped
    type: bool
    restore_value: no
    initial_value: "false"

  # ---- persisted calibration ----
  - id: cal_angle_down
    type: float
    restore_value: yes
    initial_value: "0.0"
  - id: cal_angle_up
    type: float
    restore_value: yes
    initial_value: "0.0"
  - id: cal_angle_float
    type: float
    restore_value: yes
    initial_value: "0.0"
  - id: cal_angle_max
    type: float
    restore_value: yes
    initial_value: "0.0"
  - id: cal_down_done
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: cal_up_done
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: cal_float_done
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: cal_max_done
    type: bool
    restore_value: yes
    initial_value: "false"
  # Guide (ADR-016): boat floating, bunks still a slip centerline. Capture-only
  # until a go-to exists. Internal id is guide, not float (float = Ready).
  - id: cal_angle_guide
    type: float
    restore_value: yes
    initial_value: "0.0"
  - id: cal_guide_done
    type: bool
    restore_value: yes
    initial_value: "false"

  # ---- persisted SLAVE (IMU #2) calibration — its own captures at the same
  #      physical positions; the ~5° frame racking is calibrated out this way ----
  - id: cal2_angle_down
    type: float
    restore_value: yes
    initial_value: "0.0"
  - id: cal2_angle_up
    type: float
    restore_value: yes
    initial_value: "0.0"
  - id: cal2_angle_float
    type: float
    restore_value: yes
    initial_value: "0.0"
  - id: cal2_angle_max
    type: float
    restore_value: yes
    initial_value: "0.0"
  - id: cal2_down_done
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: cal2_up_done
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: cal2_float_done
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: cal2_max_done
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: cal2_angle_guide
    type: float
    restore_value: yes
    initial_value: "0.0"
  - id: cal2_guide_done
    type: bool
    restore_value: yes
    initial_value: "false"

  # ---- derived height + position zones — computed ONCE by the 250 ms supervisor;
  #      every other consumer (status text, LEDs, observer, panel link, do_goto)
  #      reads these instead of re-deriving span/percent locally (rev H dedupe) ----
  - id: have_cal                 # Lift + Lowered captured and span sane
    type: bool
    restore_value: no
    initial_value: "false"
  - id: lift_pct                 # height % of calibrated span (NAN until calibrated)
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: zone_tol_pct             # Zone Tolerance (deg) converted to % of span
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: ready_target_pct         # Ready setpoint as % of span (NAN until Ready captured)
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: guide_target_pct         # Guide setpoint as % of span (NAN until Guide captured)
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: pos_at_lowered
    type: bool
    restore_value: no
    initial_value: "false"
  - id: pos_at_ready
    type: bool
    restore_value: no
    initial_value: "false"
  - id: pos_at_guide
    type: bool
    restore_value: no
    initial_value: "false"
  - id: pos_at_max
    type: bool
    restore_value: no
    initial_value: "false"
  - id: pos_at_top               # at/above the Lift Target % band (angle_valid-gated like the other zones)
    type: bool
    restore_value: no
    initial_value: "false"
  # slave-side height — computed ONCE by the 250 ms supervisor (rev-H idiom),
  # read by Slave Height / Level Status / the leveling logic
  - id: have_cal2                # slave Lift + Lowered captured and span sane
    type: bool
    restore_value: no
    initial_value: "false"
  - id: slave_pct                # slave height % of ITS calibrated span (NAN until calibrated)
    type: float
    restore_value: no
    initial_value: "NAN"

  # ---- valve command-vs-feedback agreement (manual-operation detector; DISPLAY ONLY) ----
  - id: valve_cmd_open_prev   # last-seen Y2 command, to timestamp command changes
    type: bool
    restore_value: no
    initial_value: "false"
  - id: valve_cmd_since       # millis the valve command last changed (grace window anchor)
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: valve_disagree_since  # millis the disagreement first appeared (0 = agreeing)
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: valve_disagree        # latched after persistence: actual valve pos != commanded
    type: bool
    restore_value: no
    initial_value: "false"

  # ---- last move timing (for calibration runs + diagnostics) ----
  - id: prev_lift_state
    type: int
    restore_value: no
    initial_value: "0"
  - id: move_start_ms
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: move_start_angle
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: last_move_duration_sec
    type: float
    restore_value: no
    initial_value: "0.0"

  # ---- boat presence, classified from RAISE speed only (rev F→G, §5.1) ----
  # Fail-safe: unknown => boat_present ON + boat_heavy ON (boat Lift shutoff).
  # Lift uses two shutoffs: confirmed empty → empty-max ceiling; any boat or
  # unknown → boat (Cobalt) ceiling. Persisted; resets to unknown/presumed-
  # heavy at LOWERED_VENT / bypass.
  - id: boat_present
    type: bool
    restore_value: yes
    initial_value: "true"
  - id: boat_heavy               # true = Cobalt-class / tower boat (diagnostic class)
    type: bool                   # only meaningful when boat_load_known && boat_present
    restore_value: yes
    initial_value: "true"
  - id: boat_load_known          # true only after a clean raise-rate classification
    type: bool                   # false = fail-safe UNKNOWN; persisted until Lowered/bypass
    restore_value: yes
    initial_value: "false"
  - id: presence_start_pct       # master height % when the raise began (NAN = not armed)
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: presence_classified      # this raise already classified (init true = nothing armed)
    type: bool
    restore_value: no
    initial_value: "true"

  # ---- Phase-1 auto-maintain OBSERVE (instrumentation only; NEVER drives outputs) ----
  - id: obs_height_filt          # wave-stripped EMA of height % (-999 = uninit)
    type: float
    restore_value: no
    initial_value: "-999.0"
  - id: obs_win_min              # running min over the current 60 s wave window
    type: float
    restore_value: no
    initial_value: "1000000.0"
  - id: obs_win_max              # running max over the current 60 s wave window
    type: float
    restore_value: no
    initial_value: "-1000000.0"
  - id: obs_win_start
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: obs_wave_pp              # last completed 60 s peak-to-peak (wave amplitude)
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: obs_rate_last_h          # filtered height at last sag-rate sample
    type: float
    restore_value: no
    initial_value: "-999.0"
  - id: obs_rate_last_t
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: obs_sag_rate             # %/hour drift of filtered height (negative = sagging)
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: obs_arm_mode             # latched: 0=idle, 1=Lift, 2=Ready
    type: int
    restore_value: no
    initial_value: "0"
  - id: obs_settled_since        # when we armed at a maintained setpoint (0 = not armed)
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: obs_below_since          # when filtered height first dropped below threshold (0 = not below)
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: obs_below_now            # live: filtered height currently below threshold
    type: bool
    restore_value: no
    initial_value: "false"
  - id: maintain_block_reason     # 0=clear, 1=Ready load, 2=Ready floor, 3=bad config, 4=Max load
    type: int
    restore_value: no
    initial_value: "0"
  - id: obs_shadow_count         # would-be top-ups since boot (counted whether or not we actuate)
    type: int
    restore_value: no
    initial_value: "0"
  - id: obs_act_count            # REAL height top-ups since boot
    type: int
    restore_value: no
    initial_value: "0"
  - id: obs_last_shadow          # millis of last shadow/real top-up (0 = none)
    type: unsigned long
    restore_value: no
    initial_value: "0"
  # ---- per-visit maintain counters (reset when arriving at a new maintained position) ----
  - id: visit_pos                # 0=none/ended, 1=Lift, 2=Ready
    type: int
    restore_value: no
    initial_value: "0"
  - id: visit_height_count       # height top-ups during the current (or last) visit
    type: int
    restore_value: no
    initial_value: "0"
  - id: visit_level_count        # at-rest level pulses during the current (or last) visit
    type: int
    restore_value: no
    initial_value: "0"
  # (rev I: cal_ref_pitch / cal_ref_pitch_done removed with the pitch tilt proxy —
  #  the two-IMU Level Error + level_divergence FAULT cover list end to end.)

  # ---- Air Loss Alert scratch (§15.5 — alert-only, never actuates) ----
  - id: seal_ref_filt            # filtered-height reference for the sealed-drop check
    type: float
    restore_value: no
    initial_value: "-999.0"
  - id: seal_ref_ms
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: seal_since               # when both valves last became commanded-closed (0 = not sealed)
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: air_alert_latch_ms       # sealed-drop events latch the alert ~30 min
    type: unsigned long
    restore_value: no
    initial_value: "0"
  - id: air_alert
    type: bool
    restore_value: no
    initial_value: "false"
  - id: air_alert_reason
    type: std::string
    restore_value: no
    initial_value: '""'

# ---------------------------------------------------------------------------
#  Tunables — live-editable from Home Assistant (persisted)
# ---------------------------------------------------------------------------
number:
  # ---- calibration setpoints (editable; globals persist in flash) ----
  #      rev E: filed under 4 · Advanced Tuning — these are fine-nudge sliders;
  #      everyday calibration is the "Calibrate: set …" capture buttons, and the
  #      Calibration Summary line in Configuration shows the resulting zones.
  - platform: template
    name: "Cal Angle — Lowered"
    id: cal_num_lowered
    web_server: {sorting_group_id: group_advanced, sorting_weight: 70}
    min_value: -35      # tightened 2026-07-18 from ±90: field range is ~-21° (above
    max_value: 65       # Lift Max) .. ~+52° (settled bottom), margin included
    step: 0.05
    unit_of_measurement: "°"
    entity_category: config
    lambda: 'return id(cal_angle_down);'
    set_action:
      - lambda: |-
          id(cal_angle_down) = x;
          id(cal_down_done) = true;
          ESP_LOGI("cal", "LOWERED adjusted to %.2f deg (zone: > %.2f)",
                   x, x - id(zone_tol_deg).state);
  - platform: template
    name: "Cal Angle — Ready"
    id: cal_num_ready
    web_server: {sorting_group_id: group_advanced, sorting_weight: 71}
    min_value: -35      # tightened 2026-07-18 from ±90: field range is ~-21° (above
    max_value: 65       # Lift Max) .. ~+52° (settled bottom), margin included
    step: 0.05
    unit_of_measurement: "°"
    entity_category: config
    lambda: 'return id(cal_angle_float);'
    set_action:
      - lambda: |-
          id(cal_angle_float) = x;
          id(cal_float_done) = true;
          float rt = id(zone_tol_deg).state;
          ESP_LOGI("cal", "READY adjusted to %.2f deg (zone: %.2f .. %.2f)",
                   x, x - rt, x + rt);
  - platform: template
    name: "Cal Angle — Lift"
    id: cal_num_top
    web_server: {sorting_group_id: group_advanced, sorting_weight: 72}
    min_value: -35      # tightened 2026-07-18 from ±90: field range is ~-21° (above
    max_value: 65       # Lift Max) .. ~+52° (settled bottom), margin included
    step: 0.05
    unit_of_measurement: "°"
    entity_category: config
    lambda: 'return id(cal_angle_up);'
    set_action:
      - lambda: |-
          id(cal_angle_up) = x;
          id(cal_up_done) = true;
          ESP_LOGI("cal", "LIFT adjusted to %.2f deg", x);
  - platform: template
    name: "Cal Angle — Empty Max"
    id: cal_num_max
    web_server: {sorting_group_id: group_advanced, sorting_weight: 73}
    min_value: -35      # tightened 2026-07-18 from ±90: field range is ~-21° (above
    max_value: 65       # Lift Max) .. ~+52° (settled bottom), margin included
    step: 0.05
    unit_of_measurement: "°"
    entity_category: config
    lambda: 'return id(cal_angle_max);'
    set_action:
      - lambda: |-
          id(cal_angle_max) = x;
          id(cal_max_done) = true;
          float mt = id(zone_tol_deg).state;
          ESP_LOGI("cal", "EMPTY MAX adjusted to %.2f deg (zone: %.2f .. %.2f)",
                   x, x - mt, x + mt);

  # ---- SLAVE (IMU #2) calibration setpoints — captured at the SAME physical
  #      positions as the master's; leveling compares the two in % space ----
  - platform: template
    name: "Cal ${side_slave} Angle — Lowered"
    id: cal2_num_lowered
    web_server: {sorting_group_id: group_advanced, sorting_weight: 74}
    min_value: -35      # tightened 2026-07-18 (see master cal bounds)
    max_value: 65
    step: 0.05
    unit_of_measurement: "°"
    entity_category: config
    lambda: 'return id(cal2_angle_down);'
    set_action:
      - lambda: |-
          id(cal2_angle_down) = x;
          id(cal2_down_done) = true;
          ESP_LOGI("cal", "SLAVE LOWERED adjusted to %.2f deg", x);
  - platform: template
    name: "Cal ${side_slave} Angle — Ready"
    id: cal2_num_ready
    web_server: {sorting_group_id: group_advanced, sorting_weight: 75}
    min_value: -35      # tightened 2026-07-18 (see master cal bounds)
    max_value: 65
    step: 0.05
    unit_of_measurement: "°"
    entity_category: config
    lambda: 'return id(cal2_angle_float);'
    set_action:
      - lambda: |-
          id(cal2_angle_float) = x;
          id(cal2_float_done) = true;
          ESP_LOGI("cal", "SLAVE READY adjusted to %.2f deg", x);
  - platform: template
