    name: "Cal ${side_slave} Angle — Empty Max"
    id: cal2_num_max
    web_server: {sorting_group_id: group_advanced, sorting_weight: 77}
    min_value: -35
    max_value: 65
    step: 0.05
    unit_of_measurement: "°"
    entity_category: config
    lambda: 'return id(cal2_angle_max);'
    set_action:
      - lambda: |-
          id(cal2_angle_max) = x;
          id(cal2_max_done) = true;
          ESP_LOGI("cal", "SLAVE EMPTY MAX adjusted to %.2f deg", x);

  - platform: template
    name: "Lift Target (%)"
    id: top_target_pct
    web_server: {sorting_group_id: group_config, sorting_weight: 40}
    optimistic: true
    restore_value: true
    initial_value: 97
    min_value: 50
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    entity_category: config

  # THE one tolerance for every "at position" band (rev H: also absorbed the old
  # Position Tolerance % — the supervisor converts this to % of span as zone_tol_pct):
  #   lowered band:  angle > (cal lowered − this)         (one-sided; lowered = high angle)
  #   ready band:    cal ready ± this
  #   lift band:     height ≥ boat Lift Target % − (this as %)
  # Lift Target % is how close we approach the load-selected ceiling (boat or
  # empty) so a heavier day still arrives — do not set to 100.
  - platform: template
    name: "Zone Tolerance (°)"
    id: zone_tol_deg
    web_server: {sorting_group_id: group_config, sorting_weight: 41}
    optimistic: true
    restore_value: true
    initial_value: 2
    min_value: 0.5
    max_value: 10
    step: 0.5
    unit_of_measurement: "°"
    entity_category: config

  # =========================================================================
  #  4 · Advanced Tuning — set-and-forget knobs. Live-editable + persisted on
  #  the ESP32 (no recompile needed); grouped below the everyday Configuration
  #  entries so the main page stays lean.
  # =========================================================================

  # ---- mechanics / timing ----
  # (rev I: the "Valve Travel Time (s)" slider is RETIRED — since rev H its only
  #  job was the manual-valve detector's grace window, and the CR5-02 end-stop
  #  contacts are direct evidence: wrong end-stop = manual, still-moving far past
  #  worst-case travel (~7 s open / ~2.3 s close) = stuck. Fixed constants in the
  #  detector replace the knob.)

  # Sole blower failsafe (rev E: replaces the separate Blower Watchdog — the
  # absolute cap always tripped first, so the watchdog could never fire).
  # ABSOLUTE cap, any mode (manual too). MUST exceed real full-raise time
  # (OEM auto-off ~15 min). Default 4 min (2026-07-24): loaded full raise
  # measured 134 s; ~1.5x margin on the worst realistic case. Persisted on
  # the device — nudge the slider after OTA to pick up the new default.
  - platform: template
    name: "Blower Max Runtime (min)"
    id: blower_max_minutes
    web_server: {sorting_group_id: group_advanced, sorting_weight: 11}
    optimistic: true
    restore_value: true
    initial_value: 4
    min_value: 1
    max_value: 15
    step: 1
    unit_of_measurement: "min"
    entity_category: config

  - platform: template
    name: "Lower Timeout (min)"
    id: lower_timeout_minutes
    web_server: {sorting_group_id: group_advanced, sorting_weight: 12}
    optimistic: true
    restore_value: true
    initial_value: 15          # FIELD-CONFIRM: measure real full-lower time
    min_value: 1
    max_value: 30
    step: 1
    unit_of_measurement: "min"
    entity_category: config

  # (rev G: the rev F "Lower Settle Time" was replaced by the LOWERED_VENT state —
  #  reaching Lowered now leaves the vent open indefinitely, so no settle timer.)

  # ---- auto-leveling: slave follows master; throttle the side that's ahead.
  #      §21.3: deadband should stay ≈ ≤1° of arm angle — with the current ~26°
  #      span the 3 % default ≈ 0.8°. The §21.3 HARD STOP reuses Tilt Critical (°)
  #      applied to the two-IMU difference (never silently disable it). ----
  - platform: template
    name: "Level Deadband (%)"
    id: level_deadband_pct
    web_server: {sorting_group_id: group_advanced, sorting_weight: 60}
    optimistic: true
    restore_value: true
    initial_value: 1.5         # ~0.9° on the ~58° span; in-move start / parked finish
    min_value: 1
    max_value: 15
    step: 0.5
    unit_of_measurement: "%"
    entity_category: config
  - platform: template
    name: "Level Hysteresis (%)"
    id: level_hysteresis_pct
    web_server: {sorting_group_id: group_advanced, sorting_weight: 61}
    optimistic: true
    restore_value: true
    initial_value: 1           # release throttle inside deadband - this
    min_value: 0
    max_value: 10
    step: 0.5
    unit_of_measurement: "%"
    entity_category: config
  - platform: template
    name: "Level Min Hold (s)"
    id: level_min_hold_s
    web_server: {sorting_group_id: group_advanced, sorting_weight: 62}
    optimistic: true
    restore_value: true
    initial_value: 15          # min time between throttle changes (valves travel ~7 s
    min_value: 2               # open / ~2.3 s close — corrections are coarse, patient pulses)
    max_value: 120
    step: 1
    unit_of_measurement: "s"
    entity_category: config
  - platform: template
    name: "Level Catch-up Timeout (s)"
    id: level_catchup_timeout_s
    web_server: {sorting_group_id: group_advanced, sorting_weight: 63}
    optimistic: true
    restore_value: true
    initial_value: 120         # master at target but slave can't close the gap
    min_value: 10              # -> level_fail_catchup (descent if boat high; else FAULT)
    max_value: 600
    step: 5
    unit_of_measurement: "s"
    entity_category: config

  # ---- angle sensor trust ----
  - platform: template
    name: "Angle Plausibility Margin (°)"
    id: angle_margin_deg
    web_server: {sorting_group_id: group_advanced, sorting_weight: 20}
    optimistic: true
    restore_value: true
    initial_value: 10          # degrees the live angle may sit outside the
    min_value: 1               # calibrated Top..Lowered span before it's "out of range"
    max_value: 45
    step: 1
    unit_of_measurement: "°"
    entity_category: config

  - platform: template
    name: "Angle Freshness (s)"
    id: angle_fresh_seconds
    web_server: {sorting_group_id: group_advanced, sorting_weight: 21}
    optimistic: true
    restore_value: true
    initial_value: 3           # angle stale after this many s without a frame
    min_value: 1
    max_value: 30
    step: 1
    unit_of_measurement: "s"
    entity_category: config

  # ---- stall detection (raising) ----
  # Field raises (Cobalt/empty/Crestliner): worst gap between 0.2° progress
  # checkpoints is 3–4 s — a healthy raise never pauses. Grace covers valve
  # open (~7 s) + blower spool. Timeout 15 s (~4x worst gap) → dead raise
  # faults in ~35 s (grace+timeout); blower cap stays the backstop.
  # NOTE these persist in flash (restore_value): an OTA does NOT overwrite
  # values already stored on the device — nudge the sliders once after update.
  - platform: template
    name: "Stall Grace (s)"
    id: stall_grace_seconds
    web_server: {sorting_group_id: group_advanced, sorting_weight: 30}
    optimistic: true
    restore_value: true
    initial_value: 20          # don't arm stall until valve open + blower spooled
    min_value: 0
    max_value: 300
    step: 5
    unit_of_measurement: "s"
    entity_category: config

  - platform: template
    name: "Stall Timeout (s)"
    id: stall_timeout_seconds
    web_server: {sorting_group_id: group_advanced, sorting_weight: 31}
    optimistic: true
    restore_value: true
    initial_value: 15          # no progress for this long (after grace) -> fault
    min_value: 2
    max_value: 300
    step: 5
    unit_of_measurement: "s"
    entity_category: config

  - platform: template
    name: "Stall Min Progress (deg)"
    id: stall_min_progress_deg
    web_server: {sorting_group_id: group_advanced, sorting_weight: 32}
    optimistic: true
    restore_value: true
    initial_value: 0.2         # any perceptible movement counts as progress
    min_value: 0.05
    max_value: 5.0
    step: 0.05
    unit_of_measurement: "°"
    entity_category: config

  # ---- boat-presence classifier (rev G — three bands) ----
  # Early climb rate over the first 15 %-points:
  #   rate >= Empty Raise Rate Min     -> EMPTY          (empty-max Lift shutoff)
  #   rate <= Heavy Boat Raise Rate Max -> HEAVY/Cobalt  (boat Lift shutoff)
  #   in between                       -> LIGHT boat     (boat Lift shutoff)
  # Empty ships at 99 (untuned = never empty). Heavy ships tuned for this
  # install (Cobalt ~0.40–0.54 %/s, Crestliner ~0.69 %/s); raise toward Empty
  # on a fresh dock until two loaded baselines exist.
  - platform: template
    name: "Empty Raise Rate Min (% per s)"   # '/' is reserved in ESPHome URL paths
    id: empty_raise_rate_min
    web_server: {sorting_group_id: group_advanced, sorting_weight: 33}
    optimistic: true
    restore_value: true
    initial_value: 99          # 99 = classifier can never say "empty" (untuned)
    min_value: 0.05
    max_value: 99
    step: 0.05
    unit_of_measurement: "%/s"
    entity_category: config

  - platform: template
    name: "Heavy Boat Raise Rate Max (% per s)"
    id: heavy_raise_rate_max
    web_server: {sorting_group_id: group_advanced, sorting_weight: 34}
    optimistic: true
    restore_value: true
    initial_value: 0.60        # this install: Cobalt-class at/below; Crestliner above
    min_value: 0.05
    max_value: 99
    step: 0.05
    unit_of_measurement: "%/s"
    entity_category: config

  # ---- auto-maintain thresholds (observer + Phase-2 actuation) ----
  - platform: template
    name: "Maintain Sag Deadband (%)"
    id: maintain_sag_deadband
    web_server: {sorting_group_id: group_advanced, sorting_weight: 40}
    optimistic: true
    restore_value: true
    initial_value: 3           # loaded Ready trace bounce is ~0.5%; top-up well outside normal settle
    min_value: 1
    max_value: 15
    step: 0.5
    unit_of_measurement: "%"
    entity_category: config
  - platform: template
    name: "Ready Recovery Floor (%)"
    id: ready_recovery_floor_pct
    web_server: {sorting_group_id: group_advanced, sorting_weight: 40.5}
    optimistic: true
    restore_value: true
    initial_value: 5           # max drop below Ready where an automatic top-up is still safe
    min_value: 3
    max_value: 15
    step: 0.5
    unit_of_measurement: "%"
    entity_category: config
  - platform: template
    name: "Maintain Persist (s)"
    id: maintain_persist_seconds
    web_server: {sorting_group_id: group_advanced, sorting_weight: 41}
    optimistic: true
    restore_value: true
    initial_value: 60          # DATA-CONFIRM: sag must hold this long (rejects waves)
    min_value: 5
    max_value: 600
    step: 5
    unit_of_measurement: "s"
    entity_category: config
  - platform: template
    name: "Maintain Min Interval (min)"
    id: maintain_min_interval_min
    web_server: {sorting_group_id: group_advanced, sorting_weight: 42}
    optimistic: true
    restore_value: true
    initial_value: 12          # motor short-cycle guard: min spacing between top-ups
    min_value: 1
    max_value: 120
    step: 1
    unit_of_measurement: "min"
    entity_category: config
  - platform: template
    name: "Maintain Settle Delay (s)"
    id: maintain_settle_seconds
    web_server: {sorting_group_id: group_advanced, sorting_weight: 43}
    optimistic: true
    restore_value: true
    initial_value: 180         # ignore the initial settle right after reaching a setpoint
    min_value: 0
    max_value: 600
    step: 10
    unit_of_measurement: "s"
    entity_category: config
  - platform: template
    name: "Maintain Smoothing (s)"
    id: maintain_smoothing_seconds
    web_server: {sorting_group_id: group_advanced, sorting_weight: 44}
    optimistic: true
    restore_value: true
    initial_value: 20          # EMA time constant for the wave-stripped filtered height
    min_value: 1
    max_value: 120
    step: 1
    unit_of_measurement: "s"
    entity_category: config
  # ---- Air Loss Alert thresholds (§15.5 — alert-only, never actuates).
  #      "Any sink is a symptom": a sealed lift should not descend, and a parked
  #      lift should not need frequent keeper interventions. The keepers keep
  #      correcting regardless (ADR-004); HA alerts on the Air Loss Alert binary. ----
  - platform: template
    name: "Air Alert Sealed Drop (%)"
    id: air_drop_alert_pct
    web_server: {sorting_group_id: group_advanced, sorting_weight: 45}
    optimistic: true
    restore_value: true
    initial_value: 2           # filtered height falling this far in 30 s while both
    min_value: 0.5             # valves are commanded closed -> sinking-while-sealed
    max_value: 10              # (normal sealed seep measured ~5-13 %/h; spiral ~1 %/s)
    step: 0.5
    unit_of_measurement: "%"
    entity_category: config
  - platform: template
    name: "Air Alert Sag Rate (% per h)"
    id: air_sag_alert_rate
    web_server: {sorting_group_id: group_advanced, sorting_weight: 46}
    optimistic: true
    restore_value: true
    initial_value: 20          # parked sag rate beyond this (downward) -> alert
    min_value: 2
    max_value: 200
    step: 1
    unit_of_measurement: "%/h"
    entity_category: config
  - platform: template
    name: "Air Alert Visit Events"
    id: air_visit_alert_count
    web_server: {sorting_group_id: group_advanced, sorting_weight: 49}
    optimistic: true
    restore_value: true
    initial_value: 4           # top-ups + level fixes in one visit at/above this -> alert
    min_value: 2
    max_value: 20
    step: 1
    entity_category: config

  # ---- at-rest level keeper (Lift only) ----
  - platform: template
    name: "Rest Level Trigger (%)"
    id: rest_level_trigger_pct
    web_server: {sorting_group_id: group_advanced, sorting_weight: 47}
    optimistic: true
    restore_value: true
    initial_value: 2.5         # |level error| to start an at-rest pulse (dock 2026-09-10)
    min_value: 1
    max_value: 10
    step: 0.5
    unit_of_measurement: "%"
    entity_category: config
  - platform: template
    name: "Rest Level Persist (s)"
    id: rest_level_persist_s
    web_server: {sorting_group_id: group_advanced, sorting_weight: 48}
    optimistic: true
    restore_value: true
    initial_value: 15          # error must persist this long before a rest pulse
    min_value: 5
    max_value: 120
    step: 5
    unit_of_measurement: "s"
    entity_category: config

  # ---- Tilt Critical: never-exceed live list + Ready residual (ADR-015).
  #      Two-IMU error in degrees of arm through the master span. Default 3°
  #      ≈ HydroHoist 3 in side-to-side at Lift. Name kept so the flash-
  #      persisted value survives. A live device at 5° must be nudged after OTA. ----
  - platform: template
    name: "Tilt Critical (deg)"
    id: tilt_critical_deg
    web_server: {sorting_group_id: group_advanced, sorting_weight: 51}
    optimistic: true
    restore_value: true
    initial_value: 3           # OEM 3 in side-to-side ≈ 3° of arm at Lift.
    # Flash-persisted: a live device still at 5° must be nudged after OTA.
    min_value: 1               # 1° is a dock/HA test trip, not an operating setpoint
    max_value: 5               # old wall; past this is dump/slip territory — not a knob
    step: 0.5
    unit_of_measurement: "°"
    entity_category: config

  # One-shot bunk-inch destination. Typing stores the target; Go to Height
  # converts it through the arm sine and runs the existing go-to. Not a mode
  # the keeper holds, and it does not rewrite Guide or any other capture.
  - platform: template
    name: "Target Height"
    id: target_height_num
    icon: "mdi:arrow-expand-vertical"
    web_server: {sorting_group_id: group_control, sorting_weight: 4.5}
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: -24
    max_value: 48
    step: 0.1
    unit_of_measurement: "in"
    mode: box
    entity_category: config

# ---------------------------------------------------------------------------
#  Outputs — written ONLY by apply_outputs (never elsewhere)
#  NOTE: 'inverted' below assumes A16 active-low transistor outputs (as in
#        a16_basic.yaml). FIELD-CONFIRM against actual wiring / relay logic.
# ---------------------------------------------------------------------------
switch:
  # Bench test: when ON, the FSM stops driving outputs (toggle Blower/Valve relays by
  # hand to verify wiring) AND button presses are ignored — no mode changes. Presses
  # still log + flip the diagnostic binary_sensors so you can check input wiring.
  # Turn OFF for normal operation.
  - platform: template
    name: "Bench Test (FSM off)"
    id: bench_test_mode
    icon: "mdi:wrench"
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: config
    web_server: {sorting_group_id: group_bench, sorting_weight: 10}
    turn_on_action:
      - lambda: 'id(test_mode) = true;'
    turn_off_action:
      - lambda: 'id(test_mode) = false;'
      - script.execute: apply_outputs    # re-assert safe FSM outputs on exit

  # One-shot: the level supervisor treats list as past Tilt Critical on the
  # next armed tick (same path as a real hose-off). ALWAYS_OFF on boot so a
  # power cycle cannot descend. Turns itself off when the descent starts.
  # Bench Test must be OFF (FSM running). This WILL move the lift.
  - platform: template
    name: "Test: inject level fail"
    id: test_inject_level_fail
    icon: "mdi:alert-decagram"
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: config
    web_server: {sorting_group_id: group_bench, sorting_weight: 15}

  # ---- Bypass Mode (manual override) ----
  # ON  = open the valve, blower OFF, sit hands-off (lift vents/floats; FSM idle).
  # OFF = return to normal HOLD operation.
  # Enter via this switch (web/HA) or panel Diagnostics BYPASS_ON — not the dock
  # red button (Stop remains the universal stop / safe-output control).
  # All button LEDs are OFF while in bypass (dark panel = bypass).
  - platform: template
    name: "Bypass Mode"
    id: bypass_mode_switch
    icon: "mdi:valve-open"
    optimistic: true
    restore_mode: ALWAYS_OFF
    web_server: {sorting_group_id: group_control, sorting_weight: 20}
    turn_on_action:
      - script.execute: enter_bypass
    turn_off_action:
      - script.execute: exit_bypass

  # (rev G: the four "Test LED" wiring-test switches were removed — ring wiring
  #  was confirmed at commissioning and the FSM LED driver covers every cadence.)

  # ---- Auto-Maintain Height / Auto-Maintain Level (Control — dock-facing keepers) ----
  # rev I: renamed back to Auto-* so the automation is explicit on the page.
  # Height: Ready / Lift (boat or empty ceiling). Level: BOTH the in-move throttle on every go-to
  # AND the at-rest correction pulses while parked at Lift. Defaults ON.
  - platform: template
    name: "Auto-Maintain Height"
    id: auto_maintain_switch
    icon: "mdi:arrow-up-bold-box"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server: {sorting_group_id: group_control, sorting_weight: 10}
  - platform: template
    name: "Auto-Maintain Level"
    id: auto_level_switch
    icon: "mdi:scale-balance"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    web_server: {sorting_group_id: group_control, sorting_weight: 11}

  - platform: gpio
    id: blower_relay
    name: "Blower Relay (Y1) — bench only"
    entity_category: config
    web_server: {sorting_group_id: group_bench, sorting_weight: 30}
    restore_mode: ALWAYS_OFF
    pin:
      pcf8574: outputs_1_8
      number: ${blower_out_pin}
      # HISTORY (2026-07-19, one very long day): the original chain ran the
      # blower on the relay's NC path — opposite sense of the valves, fail-
      # DEADLY (blower-OFF needed an energized coil), found via the all-night
      # dead-head; rev E.2 flipped software to inverted:false to match.
      # Blower on the NO path — coil de-energized =
      # motor OFF. Chain is now fail-SAFE (dark ESP/PCF or failed coil = motor
      # off) and the cold-boot blip is gone (PCF8574 powers up HIGH = OFF).
      # inverted:true restored IN THE SAME VISIT (rev F.6) — hardware and this
      # flag flip together, never one half alone. Verify on every change here:
      # motor silent at boot, then bench-toggle ON runs / OFF stops.
      inverted: true

  - platform: gpio
    id: valve_power_open
    name: "Valve ${side_master} (Y2) — bench only"   # rev F.3: dock names, A/B labels dropped
    entity_category: config
    web_server: {sorting_group_id: group_bench, sorting_weight: 31}
    restore_mode: ALWAYS_OFF     # auto-return valve: unpowered = closed
    pin:
      pcf8574: outputs_1_8
      number: ${valve_power_out_pin}
      inverted: true

  - platform: gpio
    id: valve_power_open_b
    name: "Valve ${side_slave} (Y3) — bench only"    # rev F.3: dock names, A/B labels dropped
    entity_category: config
    web_server: {sorting_group_id: group_bench, sorting_weight: 32}
    restore_mode: ALWAYS_OFF     # auto-return valve: unpowered = closed
    pin:
      pcf8574: outputs_1_8
      number: ${valve_b_out_pin}
      inverted: true

output:
  - platform: gpio                 # Y4 — Top button ring (white)
    id: led_top
    pin:
      pcf8574: outputs_1_8
      number: ${led_top_pin}
      inverted: true
  - platform: gpio                 # Y5 — Stop button ring (red)
    id: led_stop
    pin:
      pcf8574: outputs_1_8
      number: ${led_stop_pin}
      inverted: true
  - platform: gpio                 # Y6 — Ready button ring (orange)
    id: led_ready
    pin:
      pcf8574: outputs_1_8
      number: ${led_ready_pin}
      inverted: true
  - platform: gpio                 # Y7 — Lowered button ring (green)
    id: led_lowered
    pin:
      pcf8574: outputs_1_8
      number: ${led_lowered_pin}
      inverted: true

# ---------------------------------------------------------------------------
#  Inputs — buttons emit INTENTS. (No hardware top-limit fitted; raising stops
#  on the calibrated Top angle + blower watchdog/runtime cap.)
#  Mode buttons retarget mid-motion (last press wins); Stop cancels to HOLD.
#  'inverted: true' => contact-closed reads as true.
# ---------------------------------------------------------------------------
binary_sensor:
  # ---- MAIN: single problem flag for alerting (fault / angle offline / uncalibrated) ----
  - platform: template
    name: "Lift Problem"
    id: lift_problem
    device_class: problem
    web_server: {sorting_group_id: group_status, sorting_weight: 10}
    lambda: |-
      return id(lift_state) == ${S_FAULT} || id(lift_state) == ${S_BYPASS}
             || id(lift_state) == ${S_EMERG} || id(emerg_lock)
             || !id(angle_trusted)
             || (id(have_cal2) && !id(angle2_trusted))
             || !(id(cal_down_done) && id(cal_up_done));

  # ---- HA convenience: ON = a person asked the lift to move (dock/panel button,
  #      web, or HA) and that move is still running; OFF when it settles.
  #      Machine-initiated motion (auto-maintain top-ups, emergency descent)
  #      stays OFF — this is "someone is operating the lift", not "lift moving". ----
  - platform: template
    name: "Lift In Operation"
    id: lift_in_operation
    device_class: running
    web_server: {sorting_group_id: group_status, sorting_weight: 12}
    lambda: |-
      return (id(lift_state) == ${S_RAISING} || id(lift_state) == ${S_LOWERING})
             && id(user_cmd_move);

  # ---- boat presence — ON = boat aboard OR unknown (fail-safe occupancy).
  #      Lift shutoff uses Boat Load State (empty vs any boat), not this bit alone.
  #      Classified from raise speed only (§5.1); resets to ON at LOWERED_VENT/bypass. ----
  - platform: template
    name: "Boat Present"
    id: boat_present_sensor
    device_class: occupancy
    web_server: {sorting_group_id: group_status, sorting_weight: 25}   # 30 collides with Water Temperature
    lambda: 'return id(boat_present);'

  # ---- Air Loss Alert (§15.5): ON = air is leaving abnormally — sinking while
  #      sealed, high parked sag rate, or frequent keeper interventions. Alert
  #      only, never actuates; "Air Loss Detail" (Diagnostics) + log tag
  #      "airloss" carry the reason. ----
  - platform: template
    name: "Air Loss Alert"
    id: air_loss_alert
    device_class: problem
    web_server: {sorting_group_id: group_status, sorting_weight: 11}
    lambda: 'return id(air_alert);'

  # ---- Angle-sensor (MPU/WT901) health: ON = receiving fresh, valid frames ----
  # (rev E: filed under Diagnostics — Lift Problem + Lift Status already surface
  #  an offline sensor on the main page; the entities stay for HA alerting.)
  - platform: template
    name: "IMU ${side_master} OK"
    device_class: connectivity
    web_server: {sorting_group_id: group_diag, sorting_weight: 12}
    lambda: 'return id(angle_valid);'

  # ---- Slave IMU (#2) health — leveling silently degrades to ganged v1 when OFF ----
  - platform: template
    name: "IMU ${side_slave} OK"
    device_class: connectivity
    web_server: {sorting_group_id: group_diag, sorting_weight: 13}
    lambda: 'return id(angle2_valid);'

  # (rev E: "Maintain: Sagging Now" and "Lift Tilt Warn" were removed — the
  #  Maintain Observe line carries the sag story, and the numeric Lift Tilt
  #  covers anything below the critical threshold.)
  # (rev H: Auto-Maintain Lockout binary removed — sticky lockout that disabled
  #  height/level keeping was the wrong failure mode; visit counters replace it.)
  # (rev I: the pitch tilt proxy is RETIRED — Lift Tilt Critical, Lift Tilt, the
  #  LEVEL ref capture and its cal globals are gone. The two-IMU Level Error is
  #  the list signal, and the §16.3 level_divergence FAULT is the hard stop.)

  # rev G: the four button diagnostics + four valve feedback contacts are
  # disabled_by_default — hidden from HA (enable per-entity there if ever
  # needed) but still fully live in the dock web UI and every lambda.
  - platform: gpio
    id: btn_top
    name: "Button — White · Lift (DI13)"
    entity_category: diagnostic
    disabled_by_default: true
    web_server: {sorting_group_id: group_bench, sorting_weight: 74}
    pin:
      pcf8574: inputs_9_16
      number: ${btn_top_in_pin}
      mode: INPUT
      inverted: true
    filters: [delayed_on: 30ms]
    on_press:
      - logger.log: {format: "INPUT: Button LIFT (DI13) PRESSED", tag: "input_test", level: INFO}
      - script.execute: request_goto_top
    on_release:
      - logger.log: {format: "INPUT: Button LIFT (DI13) released", tag: "input_test", level: INFO}

  - platform: gpio
    id: btn_stop
    name: "Button — Red · Stop (DI12)"
    entity_category: diagnostic
    disabled_by_default: true
    web_server: {sorting_group_id: group_bench, sorting_weight: 71}
    pin:
      pcf8574: inputs_9_16
      number: ${btn_stop_in_pin}
      mode: INPUT
      inverted: true
    filters: [delayed_on: 30ms]
    # Press = Stop while moving / clear FAULT / exit Bypass / seal Lowered vent.
    # Dock long-hold Bypass removed — use Bypass Mode (web/HA) or panel Diagnostics.
    on_press:
      - logger.log: {format: "INPUT: Button STOP (DI12) PRESSED", tag: "input_test", level: INFO}
      - script.execute: request_stop
    on_release:
      - logger.log: {format: "INPUT: Button STOP (DI12) released", tag: "input_test", level: INFO}

  - platform: gpio
    id: btn_lowered
    name: "Button — Green · Lower (DI16)"
    entity_category: diagnostic
    disabled_by_default: true
    web_server: {sorting_group_id: group_bench, sorting_weight: 73}
    pin:
      pcf8574: inputs_9_16
      number: ${btn_lowered_in_pin}
      mode: INPUT
      inverted: true
    filters: [delayed_on: 30ms]
    on_press:
      - logger.log: {format: "INPUT: Button LOWER (DI16) PRESSED", tag: "input_test", level: INFO}
      - script.execute: request_goto_lowered
    on_release:
      - logger.log: {format: "INPUT: Button LOWER (DI16) released", tag: "input_test", level: INFO}

  - platform: gpio
    id: btn_ready
    name: "Button — Orange · Ready (DI11)"
    entity_category: diagnostic
    disabled_by_default: true
    web_server: {sorting_group_id: group_bench, sorting_weight: 72}
    pin:
      pcf8574: inputs_9_16
      number: ${btn_ready_in_pin}
      mode: INPUT
      inverted: true
    filters: [delayed_on: 30ms]
    on_press:
      - logger.log: {format: "INPUT: Button READY (DI11) PRESSED", tag: "input_test", level: INFO}
      - script.execute: request_goto_ready
    on_release:
      - logger.log: {format: "INPUT: Button READY (DI11) released", tag: "input_test", level: INFO}

  # ---- Valve position feedback (CR502 aux contacts) ----
  #   Instrumentation for now: reports the valve's REAL end-stop position independent of
  #   the open-loop Valve Travel Time. Maintained contacts (stay closed while at the limit),
  #   so level-sensed. Debounced 100ms to reject seating chatter. Not yet wired into the FSM.
  - platform: gpio
    id: valve_fb_open
    name: "Valve ${side_master} FB — Fully Open (X02)"
    entity_category: diagnostic
    disabled_by_default: true
    web_server: {sorting_group_id: group_bench, sorting_weight: 40}
    pin:
      pcf8574: inputs_1_8
      number: ${valve_open_fb_pin}
      mode: INPUT
      inverted: true
    filters: [delayed_on: 100ms, delayed_off: 100ms]
    on_press:
      - logger.log: {format: "VALVE STBD: fully OPEN contact closed (X02)", tag: "valve_fb", level: INFO}
    on_release:
      - logger.log: {format: "VALVE STBD: left fully-open (X02 opened)", tag: "valve_fb", level: INFO}

  - platform: gpio
    id: valve_fb_closed
    name: "Valve ${side_master} FB — Fully Closed (X01)"
    entity_category: diagnostic
    disabled_by_default: true
    web_server: {sorting_group_id: group_bench, sorting_weight: 41}
    pin:
      pcf8574: inputs_1_8
      number: ${valve_closed_fb_pin}
      mode: INPUT
      inverted: true
    filters: [delayed_on: 100ms, delayed_off: 100ms]
    on_press:
      - logger.log: {format: "VALVE STBD: fully CLOSED contact closed (X01)", tag: "valve_fb", level: INFO}
    on_release:
      - logger.log: {format: "VALVE STBD: left fully-closed (X01 opened)", tag: "valve_fb", level: INFO}

  # ---- Valve B (slave tank) position feedback — same CR5-02 pattern on X03/X04 ----
  - platform: gpio
    id: valve_b_fb_open
    name: "Valve ${side_slave} FB — Fully Open (X04)"
    entity_category: diagnostic
    disabled_by_default: true
    web_server: {sorting_group_id: group_bench, sorting_weight: 42}
    pin:
      pcf8574: inputs_1_8
      number: ${valve_b_open_fb_pin}
      mode: INPUT
      inverted: true
    filters: [delayed_on: 100ms, delayed_off: 100ms]
    on_press:
      - logger.log: {format: "VALVE PORT: fully OPEN contact closed (X04)", tag: "valve_fb", level: INFO}
    on_release:
      - logger.log: {format: "VALVE PORT: left fully-open (X04 opened)", tag: "valve_fb", level: INFO}

  - platform: gpio
    id: valve_b_fb_closed
    name: "Valve ${side_slave} FB — Fully Closed (X03)"
    entity_category: diagnostic
    disabled_by_default: true
    web_server: {sorting_group_id: group_bench, sorting_weight: 43}
    pin:
      pcf8574: inputs_1_8
      number: ${valve_b_closed_fb_pin}
      mode: INPUT
      inverted: true
    filters: [delayed_on: 100ms, delayed_off: 100ms]
    on_press:
      - logger.log: {format: "VALVE PORT: fully CLOSED contact closed (X03)", tag: "valve_fb", level: INFO}
    on_release:
      - logger.log: {format: "VALVE PORT: left fully-closed (X03 opened)", tag: "valve_fb", level: INFO}

# ---------------------------------------------------------------------------
#  Sensors
# ---------------------------------------------------------------------------
sensor:
  # ---- WT901 tilt angle (decoded from the 0x55 0x53 frame by the UART parser below) ----
  # Roll/Pitch are the two tilt axes. current_angle (used by the FSM) tracks the
  # arm-swing axis (Roll — field-confirmed).
  # (rev E: the separate Roll diagnostic was removed — "Arm Angle" IS the roll
  #  axis. rev G: the raw Pitch sensor went too. rev I: the pitch-as-list proxy
  #  is retired. Pitch is published again below for mount observation only —
  #  nothing in the FSM reads it. Threshold TBD; see design doc §13.)
  - platform: template
    name: "Arm Angle ${side_master}"
    id: arm_angle_live
    web_server: {sorting_group_id: group_diag, sorting_weight: 10}
    unit_of_measurement: "°"
    accuracy_decimals: 2
    update_interval: 1s
    filters: [delta: 0.1]
    lambda: 'return id(current_angle);'
  - platform: template
    name: "Arm Angle ${side_slave}"
    id: arm_angle2_live
    web_server: {sorting_group_id: group_diag, sorting_weight: 10.5}
    unit_of_measurement: "°"
    accuracy_decimals: 2
    update_interval: 1s
    filters: [delta: 0.1]
    lambda: 'return id(current_angle2);'

  # Pitch (Y) should sit still while the arm swings on roll. Published so HA
  # can record the installed band. Not a list signal and not a trust input yet.
  # Hold NAN until the first 0x53 frame so a boot 0° does not enter the history.
  - platform: template
    name: "Arm Pitch ${side_master}"
    id: arm_pitch_live
    entity_category: diagnostic
    state_class: measurement
    web_server: {sorting_group_id: group_diag, sorting_weight: 11}
    unit_of_measurement: "°"
    accuracy_decimals: 2
    update_interval: 1s
    filters: [delta: 0.05]
    lambda: 'return id(angle_last_update) == 0 ? NAN : id(angle_pitch);'
  - platform: template
    name: "Arm Pitch ${side_slave}"
    id: arm_pitch2_live
    entity_category: diagnostic
    state_class: measurement
    web_server: {sorting_group_id: group_diag, sorting_weight: 11.5}
    unit_of_measurement: "°"
    accuracy_decimals: 2
    update_interval: 1s
    filters: [delta: 0.05]
    lambda: 'return id(angle2_last_update) == 0 ? NAN : id(angle2_pitch);'

  - platform: template
    name: "Lift Height"
    id: lift_height_pct
    web_server: {sorting_group_id: group_status, sorting_weight: 20}
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 1s          # rev G: was 250 ms — nothing consumes this sensor
    lambda: 'return id(lift_pct);'   # single-source height % (250 ms supervisor)

  # ---- pseudo bunk height in INCHES relative to the waterline (display only) ----
  # Vertical travel of a 51 in pivot arm: Δh = L·(sin θ_lowered − sin θ). Height %
  # is linear in ANGLE, so inches-per-% grows toward the top of the stroke
  # (~0.9 in/° near horizontal vs ~0.55 in/° at the settled bottom). Add the
  # surveyed Lowered datum so negative values are below water and positive above.
  - platform: template
    name: "Bunk Height"
    id: bunk_height_in
    web_server: {sorting_group_id: group_status, sorting_weight: 21}
    unit_of_measurement: "in"
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      if (!id(height_ok)) return NAN;
      const float d2r = M_PI / 180.0f;
      float cal_down = (id(height_src) == 2) ? id(cal2_angle_down) : id(cal_angle_down);
      return ${bunk_lowered_waterline_in}
             + ${arm_length_in} * (sinf(cal_down * d2r)
                                  - sinf(id(height_angle) * d2r));

  # ---- leveling data products (single-source globals, 250 ms supervisor) ----
  # Level Error lives in Diagnostics (rev E.1): at rest it just reflects the
  # resting posture (e.g. the empty lift rides unevenly above the cal range —
  # both sides read 0 at the shared cal posture by construction), and nothing
  # acts on it outside a targeted move. The §21.3 hard stop stays armed
  # regardless and Lift Problem/FAULT is the alerting path.
  - platform: template
    name: "Level Error"
    id: level_error_pct
    entity_category: diagnostic
    web_server: {sorting_group_id: group_diag, sorting_weight: 19}
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 1s          # rev G: was 250 ms — display only, supervisor has its own copy
    lambda: 'return id(level_ok_now) ? id(level_err_filt) : NAN;'   # + = slave side HIGH

  # ---- per-visit maintain event counters (reset on arrive at a new maintained zone).
  #      rev I: moved out of Control (they're data, not controls) — kept as numeric
  #      entities for HA graphing; the Maintain Observe line shows both counts. ----
  - platform: template
    name: "Visit Height Top-ups"
    id: visit_height_topups
    icon: "mdi:arrow-up-bold-hexagon-outline"
    entity_category: diagnostic
    web_server: {sorting_group_id: group_diag, sorting_weight: 24}
    accuracy_decimals: 0
    update_interval: 1s
    lambda: 'return (float) id(visit_height_count);'
  - platform: template
    name: "Visit Level Events"
    id: visit_level_events
    icon: "mdi:scale-balance"
    entity_category: diagnostic
    web_server: {sorting_group_id: group_diag, sorting_weight: 25}
    accuracy_decimals: 0
    update_interval: 1s
    lambda: 'return (float) id(visit_level_count);'

  - platform: template
    name: "Height ${side_slave}"
    id: slave_height_pct
    entity_category: diagnostic
    web_server: {sorting_group_id: group_diag, sorting_weight: 17}
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 1s          # rev G: was 250 ms — display only
    lambda: 'return id(slave_pct);'   # single-source slave height % (250 ms supervisor)

  # (rev E: the five read-only "Cal Zone" edge sensors were removed — the
  #  "Calibration Summary" text sensor already shows every zone edge.)
  - platform: template
    name: "Last Move Duration"
    id: last_move_duration
    entity_category: diagnostic
    web_server: {sorting_group_id: group_diag, sorting_weight: 15}
    unit_of_measurement: "s"
    accuracy_decimals: 1
    update_interval: 1s
    lambda: 'return id(last_move_duration_sec);'
  # (rev E: Last Move Start/End Angle sensors removed — the "move" log lines
  #  carry both angles, and Last Move Duration stays for calibration runs.)

  # ---- Phase-1 auto-maintain OBSERVE outputs (data product; NO actuation) ----
  - platform: template
    name: "Lift Height (filtered)"
    id: lift_height_filt
    entity_category: diagnostic
    web_server: {sorting_group_id: group_diag, sorting_weight: 20}
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 1s
    lambda: 'return (id(obs_height_filt) < -900.0f) ? NAN : id(obs_height_filt);'
  - platform: template
    name: "Lift Wave P-P (60s)"
    id: lift_wave_pp
    entity_category: diagnostic
    web_server: {sorting_group_id: group_diag, sorting_weight: 21}
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: 'return id(obs_wave_pp);'
  - platform: template
    name: "Lift Sag Rate"
    id: lift_sag_rate
    entity_category: diagnostic
    web_server: {sorting_group_id: group_diag, sorting_weight: 22}
    unit_of_measurement: "%/h"
    accuracy_decimals: 2
    update_interval: 10s
    lambda: 'return id(obs_sag_rate);'   # negative = sagging
  # (rev E: the Shadow/Auto/Window top-up count sensors were removed — the
  #  "Maintain Observe" text line reports all three counters.)
  # (rev I: "Lift Tilt" removed with the pitch proxy — Level Error is the list signal.
  #  Arm Pitch Starboard/Port are the raw Y axes, for observation only.)

  - platform: dallas_temp
    name: "Lift Water Temperature"
    id: water_temp
    web_server: {sorting_group_id: group_status, sorting_weight: 30}
    update_interval: 30s

  # ---- diagnostics: spot reboots / WiFi degradation from Home Assistant ----
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
    web_server: {sorting_group_id: group_diag, sorting_weight: 50}
    update_interval: 30s
  - platform: wifi_signal
    name: "WiFi Signal"
    entity_category: diagnostic
    web_server: {sorting_group_id: group_diag, sorting_weight: 51}
    update_interval: 60s

text_sensor:
  # ---- Valve position (derived from the two CR502 aux contacts; read-only) ----
  #   OPEN=vent open  CLOSED=sealed  MOVING=mid-travel or stuck  FAULT=both contacts on (impossible)
  # ---- MAIN: both valves' REAL positions (from feedback contacts) on one line,
  #      at the top of Status. During leveling moves this shows the throttle
  #      actually closing one side. ----
  - platform: template
    name: "Valve Positions"
    id: valve_positions_text
    web_server: {sorting_group_id: group_status, sorting_weight: 6}
    update_interval: 1s
    lambda: |-
      auto pos = [](bool o, bool c) -> const char* {
        if (o && c) return "FAULT";
        if (o)      return "OPEN";
        if (c)      return "CLOSED";
        return "MOVING";
      };
      char b[64];
      snprintf(b, sizeof(b), "${side_master} %s · ${side_slave} %s",
               pos(id(valve_fb_open).state,   id(valve_fb_closed).state),
               pos(id(valve_b_fb_open).state, id(valve_b_fb_closed).state));
      return std::string(b);

  # (rev G: the per-side "Valve … Position" diagnostic text sensors were removed —
  #  strict subsets of the combined Valve Positions line above; the raw feedback
  #  binary_sensors remain for per-valve HA triggers if ever needed.)

  # ---- MAIN: human-readable overall status (priority ladder) ----
  - platform: template
    name: "Calibration Summary"
    id: cal_summary_text
    entity_category: config
    web_server: {sorting_group_id: group_config, sorting_weight: 20}
    update_interval: 1s
    lambda: |-
      char b[200];
      if (!id(cal_down_done) && !id(cal_float_done) && !id(cal_up_done)
          && !id(cal_max_done) && !id(cal_guide_done))
        return std::string("Not calibrated");
      int n = 0;
      if (id(cal_down_done)) {
        float lim = id(cal_angle_down) - id(zone_tol_deg).state;
        n += snprintf(b, sizeof(b), "Lowered: >%.1f° (cal %.1f°)", lim, id(cal_angle_down));
      } else {
        n += snprintf(b, sizeof(b), "Lowered: —");
      }
      if (id(cal_guide_done)) {
        float gt = id(zone_tol_deg).state;
        n += snprintf(b + n, sizeof(b) - n, "  Guide: %.1f..%.1f°",
                      id(cal_angle_guide) - gt, id(cal_angle_guide) + gt);
      } else {
        n += snprintf(b + n, sizeof(b) - n, "  Guide: —");
      }
      if (id(cal_float_done)) {
        float rt = id(zone_tol_deg).state;
        n += snprintf(b + n, sizeof(b) - n, "  Ready: %.1f..%.1f°",
                      id(cal_angle_float) - rt, id(cal_angle_float) + rt);
      } else {
        n += snprintf(b + n, sizeof(b) - n, "  Ready: —");
      }
      if (id(cal_up_done)) {
        n += snprintf(b + n, sizeof(b) - n, "  Lift: %.1f°", id(cal_angle_up));
      } else {
        n += snprintf(b + n, sizeof(b) - n, "  Lift: —");
      }
      if (id(cal_max_done)) {
        n += snprintf(b + n, sizeof(b) - n, "  Empty: %.1f°", id(cal_angle_max));
      } else {
        n += snprintf(b + n, sizeof(b) - n, "  Empty: —");
      }
      return std::string(b);

  # ---- MAIN: machine-friendly status pair for HA automations (rev G).
  #      Lift Activity = what the lift is DOING; Lift Position = WHERE it is.
  #      Short stable Title-Case tokens for exact-match triggers — no percentages
  #      or reasons embedded, so states only change on real transitions.
  #      (Replaces the old "Lift State (raw)" diagnostic.)
  #      rev I: filed at the BOTTOM of Status — they exist for HA, and the human
  #      story is told by Lift Status (Control headline) + the lines above. ----
  - platform: template
    name: "Lift Activity"
    id: lift_activity_text
    web_server: {sorting_group_id: group_status, sorting_weight: 45}
    update_interval: 1s
    lambda: |-
      switch (id(lift_state)) {
        case ${S_RAISING}:  return std::string("Raising");
        case ${S_LOWERING}: return std::string("Lowering");
        case ${S_FAULT}:    return std::string("Fault");
        case ${S_BYPASS}:   return std::string("Bypass");
        case ${S_EMERG}:    return std::string("Emergency Descent");
        default:
          if (id(emerg_lock)) return std::string("Emergency Descent");
          if (id(rest_pulse) != 0) return std::string("Leveling");
          return std::string("Idle");   // HOLD + LOWERED_VENT
      }
  - platform: template
    name: "Lift Position"
    id: lift_position_text
    web_server: {sorting_group_id: group_status, sorting_weight: 46}
    update_interval: 1s
    lambda: |-
      // zone ladder mirrors Lift Status; valid mid-move too (reports the zone
      // being passed through). Unknown = sensor untrusted or not calibrated.
      if (!id(height_ok) || std::isnan(id(lift_pct)))
        return std::string("Unknown");
      if (id(pos_at_guide))   return std::string("Guide");
      if (id(pos_at_lowered)) return std::string("Lowered");
      if (id(pos_at_ready))   return std::string("Ready");
      if (id(pos_at_top))     return std::string("Lifted");
      return std::string("Between");

  # ---- human-readable status line (web UI + panel msg=). rev G: percentages
  #      dropped from the moving states — Lift Height sits right beside it, and
  #      without the number the string only changes on real transitions.
  #      rev I: filed at the TOP of Control (weight 0) — the page's headline:
  #      what the lift is doing, with the buttons directly beneath it. ----
  - platform: template
    name: "Lift Status"
    id: lift_status_text
    update_interval: 1s
    web_server: {sorting_group_id: group_control, sorting_weight: 0}
    lambda: |-
      float pct = id(lift_pct);
      int s = id(lift_state);
      const char* mn = id(goto_mode) == ${M_LIFT} ? "Lift"
                     : (id(goto_mode) == ${M_READY} ? "Ready"
                     : (id(goto_mode) == ${M_GUIDE} ? "Guide"
                     : (id(goto_mode) == ${M_HEIGHT} ? "Height" : "Lower")));
      // 1) emergency descent (ADR-015) — outranks everything but shares FAULT's tier
      if (s == ${S_EMERG}) {
        if (id(goto_mode) == ${M_LOWER})
          return std::string("EMERGENCY — descending to Lowered (level failure)");
        return std::string("EMERGENCY — descending to Ready (level failure)");
      }
      if (id(emerg_lock))
        return std::string("EMERGENCY — lowered, vents open (level failure)");
      // 1a) fault
      if (s == ${S_FAULT}) return std::string("FAULT — ") + id(fault_reason);
      // 1b) bypass — manual override, valve open, hands-off
      if (s == ${S_BYPASS}) return std::string("BYPASS — valve open, blower off (manual override)");
      // 2) moving (manual jog if angle offline; else go-to with target name)
      if (s == ${S_RAISING}) {
        if (!id(height_ok)) return std::string("MANUAL raising…");
        std::string line = std::string("Raising -> ") + mn;
        if (id(height_src) == 2) line += " (port angle)";
        else if (id(have_cal2) && !id(angle2_trusted)) line += " (port IMU offline)";
        return line;
      }
      if (s == ${S_LOWERING}) {
        if (!id(height_ok)) return std::string("MANUAL lowering…");
        std::string line = std::string("Lowering -> ") + mn;
        if (id(height_src) == 2) line += " (port angle)";
        else if (id(have_cal2) && !id(angle2_trusted)) line += " (port IMU offline)";
        return line;
      }
      // 2b) resting at Lowered with the vent left open (still settling forever)
      if (s == ${S_LOWERED_VENT}) {
        std::string line = "Lowered — vent open";
        if (id(height_src) == 2) line += " (port angle)";
        else if (id(have_cal2) && !id(angle2_trusted)) line += " (port IMU offline)";
        return line;
      }
      // 2c) valve manually operated while we're commanding it closed (display only; HOLD here)
      if (id(valve_disagree)) return std::string("Manual valve");
      // 3) HOLD: health/readiness, then resting position (mode)
      if (!id(height_ok)) {
        if (!id(have_cal) && !id(have_cal2) && (id(angle_valid) || id(angle2_valid)))
          return std::string("Not calibrated");
        if (!id(angle_valid) && !id(angle2_valid))
          return std::string("Angle sensors OFFLINE - manual control");
        if (!id(angle_trusted) && !id(angle2_trusted))
          return std::string("Angle OUT OF RANGE - manual control");
        return std::string("Angle not trusted - manual control");
      }
      std::string where;
      if (id(pos_at_guide))         where = "Guide";
      else if (id(pos_at_lowered))  where = "Lowered";
      else if (id(pos_at_ready))    where = "Ready";
      else if (id(pos_at_top))      where = "Lifted";
      else if (!std::isnan(id(ready_target_pct)))
        where = (pct < id(ready_target_pct)) ? "Between lowered/ready" : "Between ready/lifted";
      else where = "Holding";
      if (id(height_src) == 2) where += " — port angle";
      else if (id(have_cal2) && !id(angle2_trusted)) where += " — port IMU offline";
      return where;

  # (rev E: the standalone "Fault Reason" sensor was removed — the reason already
  #  rides on Lift Status ("FAULT — …") and Lift State (raw) ("FAULT: …").)

  # Why the last move ended (target / vent left open / timeout / Stop / trust loss / fault) —
  # field-debugging aid: answers "why did the valve close?" after the fact.
  - platform: template
    name: "Last Stop Reason"
    id: last_stop_reason_text
    entity_category: diagnostic
    web_server: {sorting_group_id: group_diag, sorting_weight: 16}
    update_interval: 1s
    lambda: 'return id(last_stop_reason);'

  # ---- Air Loss Alert reason ("none" when clear) — pairs with the Status binary ----
  - platform: template
    name: "Air Loss Detail"
    id: air_loss_detail
    entity_category: diagnostic
    web_server: {sorting_group_id: group_diag, sorting_weight: 26}
    update_interval: 1s
    lambda: 'return id(air_alert_reason).empty() ? std::string("none") : id(air_alert_reason);'

  # ---- leveling summary — SIMPLE + state-aware (rev I). Plain answer to "is the
  #      lift level / is leveling doing something right now". No valve words
  #      (Valve Positions is the source of truth for those) and no internal
  #      throttle vocabulary; side + high/low replaces the signed err%. ----
  - platform: template
    name: "Level Status"
    id: level_status_text
    web_server: {sorting_group_id: group_status, sorting_weight: 7}
    update_interval: 1s
    lambda: |-
      if (!id(have_cal))
        return std::string(id(height_src) == 2
            ? "${side_master} not calibrated — height from ${side_slave}, ganged"
            : "${side_master} not calibrated — ganged");
      if (!id(have_cal2))      return std::string("${side_slave} not calibrated — ganged");
      if (!id(angle_valid))
        return std::string(id(height_src) == 2
            ? "${side_master} IMU offline — height from ${side_slave}, ganged"
            : "${side_master} IMU offline — ganged");
      if (!id(angle2_valid))   return std::string("${side_slave} IMU offline — ganged");
      if (!id(angle_trusted))
        return std::string(id(height_src) == 2
            ? "${side_master} outside calibrated range — height from ${side_slave}, ganged"
            : "${side_master} outside calibrated range — ganged");
      if (!id(angle2_trusted)) return std::string("${side_slave} outside calibrated range — ganged");
      if (!id(level_ok_now))   return std::string("Not trusted — ganged");
      int rp = id(rest_pulse);
      if (rp == 1) return std::string("Leveling — feeding ${side_master}");
      if (rp == 2) return std::string("Leveling — feeding ${side_slave}");
      if (rp == 3) return std::string("Leveling — venting ${side_slave}");
      if (rp == 4) return std::string("Leveling — venting ${side_master}");
      if (id(level_throttle) == 1) return std::string("Leveling — holding ${side_master} back");
      if (id(level_throttle) == 2) return std::string("Leveling — holding ${side_slave} back");
      float e = id(level_err_filt);
      const char* pre = id(auto_level_switch).state ? "Level OK" : "Auto-level OFF";
      char b[72];
      if (fabs(e) < 0.05f) snprintf(b, sizeof(b), "%s — even", pre);
      else snprintf(b, sizeof(b), "%s — ${side_slave} %.1f%% %s",
                    pre, fabs(e), e > 0.0f ? "high" : "low");
      return std::string(b);

  # ---- Firmware build stamp: compiler auto-fills the date/time at every compile (no manual edits) ----
  - platform: template
    name: "Firmware Build"
    id: firmware_build
    entity_category: diagnostic
    web_server: {sorting_group_id: group_diag, sorting_weight: 52}
    update_interval: 6h
    lambda: 'return std::string(__DATE__ " " __TIME__);'

  # ---- Maintain summary (Status) — SIMPLE (rev I): where the lift is parked,
  #      what the keepers have done this visit, and the sag trend. Switch states
  #      show on the Auto-Maintain switches themselves; armed/disarmed internals
  #      moved to the log. ----
  - platform: template
    name: "Maintain Observe"
    id: maintain_observe_text
    web_server: {sorting_group_id: group_status, sorting_weight: 40}
    update_interval: 1s
    lambda: |-
      if (id(maintain_block_reason) == 1)
        return std::string("Ready recovery OFF — loaded boat not confirmed");
      if (id(maintain_block_reason) == 2)
        return std::string("Ready recovery INHIBITED — below safe floor");
      if (id(maintain_block_reason) == 3)
        return std::string("Ready recovery OFF — floor must exceed sag deadband");
      const char* where = id(visit_pos) == 1 ? "Lift"
                        : (id(visit_pos) == 2 ? "Ready" : nullptr);
      if (where == nullptr) return std::string("Not parked at a maintained position");
      char b[96];
      snprintf(b, sizeof(b), "At %s — %d top-ups, %d level fixes — sag %+.2f%%/h",
               where, id(visit_height_count), id(visit_level_count), id(obs_sag_rate));
      return std::string(b);

  - platform: template
    name: "Boat Load State"
    id: boat_load_state_text
    entity_category: diagnostic
    web_server: {sorting_group_id: group_diag, sorting_weight: 18}
    update_interval: 1s
    lambda: |-
      if (!id(boat_load_known)) return std::string("Unknown");
      if (!id(boat_present)) return std::string("Confirmed empty");
      return id(boat_heavy) ? std::string("Confirmed Cobalt")
                            : std::string("Confirmed other boat");

# ---------------------------------------------------------------------------
#  HA-facing controls (mirror the dock buttons through the SAME intents)
# ---------------------------------------------------------------------------
button:
  # rev I: order matches the physical dock panel (Lift / Ready / Stop / Lower) so
  # web and dock share one muscle memory.
  - platform: template
    name: "Lift"
    web_server: {sorting_group_id: group_control, sorting_weight: 1}
    on_press: {script.execute: request_goto_top}
  - platform: template
    name: "Ready"
    web_server: {sorting_group_id: group_control, sorting_weight: 2}
    on_press: {script.execute: request_goto_ready}
  - platform: template
    name: "Guide"
    web_server: {sorting_group_id: group_control, sorting_weight: 2.5}
    on_press: {script.execute: request_goto_guide}
  - platform: template
    name: "Stop"
    web_server: {sorting_group_id: group_control, sorting_weight: 3}
    on_press: {script.execute: request_stop}
  - platform: template
    name: "Lower"
    web_server: {sorting_group_id: group_control, sorting_weight: 4}
    on_press: {script.execute: request_goto_lowered}
  - platform: template
    name: "Go to Height"
    entity_category: config
    web_server: {sorting_group_id: group_control, sorting_weight: 4.6}
    on_press: {script.execute: request_goto_height}
  # (rev G: the "Reset Fault" button was removed — Stop clears a latched FAULT
  #  and exits BYPASS.)
  # (rev H: Reset Auto-Maintain Lockout removed with the sticky lockout.)
  - platform: restart
    name: "Restart"
    entity_category: config
    web_server: {sorting_group_id: group_config, sorting_weight: 60}
  # ---- calibration capture (3 setpoints; ids kept: up=Lift, down=Lowered, float=Ready) ----
  - platform: template
    name: "Calibrate: set LIFT"
    entity_category: config
    web_server: {sorting_group_id: group_config, sorting_weight: 51}
    on_press:
      - lambda: |-
          id(cal_angle_up) = id(current_angle);
          id(cal_up_done) = true;
          id(cal_num_top).publish_state(id(cal_angle_up));
          ESP_LOGI("cal", "LIFT set to %.2f deg", id(cal_angle_up));
  - platform: template
    name: "Calibrate: set EMPTY MAX"
    entity_category: config
    web_server: {sorting_group_id: group_config, sorting_weight: 50}
    on_press:
      - lambda: |-
          id(cal_angle_max) = id(current_angle);
          id(cal_max_done) = true;
          id(cal_num_max).publish_state(id(cal_angle_max));
          float mt = id(zone_tol_deg).state;
          ESP_LOGI("cal", "EMPTY MAX set to %.2f deg (zone: %.2f .. %.2f)",
                   id(cal_angle_max), id(cal_angle_max) - mt, id(cal_angle_max) + mt);
  - platform: template
    name: "Calibrate: set READY"
    entity_category: config
    web_server: {sorting_group_id: group_config, sorting_weight: 52}
    on_press:
      - lambda: |-
          id(cal_angle_float) = id(current_angle);
          id(cal_float_done) = true;
          id(cal_num_ready).publish_state(id(cal_angle_float));
          float rt = id(zone_tol_deg).state;
          ESP_LOGI("cal", "READY set to %.2f deg (zone: %.2f .. %.2f)",
                   id(cal_angle_float), id(cal_angle_float) - rt, id(cal_angle_float) + rt);
  - platform: template
    name: "Calibrate: set GUIDE"
    entity_category: config
    web_server: {sorting_group_id: group_config, sorting_weight: 52.5}
    on_press:
      - lambda: |-
          id(cal_angle_guide) = id(current_angle);
          id(cal_guide_done) = true;
          id(cal_num_guide).publish_state(id(cal_angle_guide));
          float gt = id(zone_tol_deg).state;
          ESP_LOGI("cal", "GUIDE set to %.2f deg (zone: %.2f .. %.2f)",
                   id(cal_angle_guide), id(cal_angle_guide) - gt, id(cal_angle_guide) + gt);
  - platform: template
    name: "Calibrate: set LOWERED"
    entity_category: config
    web_server: {sorting_group_id: group_config, sorting_weight: 53}
    on_press:
      - lambda: |-
          id(cal_angle_down) = id(current_angle);
          id(cal_down_done) = true;
          id(cal_num_lowered).publish_state(id(cal_angle_down));
          ESP_LOGI("cal", "LOWERED set to %.2f deg (zone: > %.2f)",
                   id(cal_angle_down), id(cal_angle_down) - id(zone_tol_deg).state);
  # ---- SLAVE (IMU #2) captures — press at the SAME physical position as the
  #      matching master capture (do both while the lift sits at each setpoint) ----
  - platform: template
    name: "Calibrate ${side_slave}: set LIFT"
    entity_category: config
    web_server: {sorting_group_id: group_config, sorting_weight: 55}
    on_press:
      - lambda: |-
          id(cal2_angle_up) = id(current_angle2);
          id(cal2_up_done) = true;
          id(cal2_num_top).publish_state(id(cal2_angle_up));
          ESP_LOGI("cal", "SLAVE LIFT set to %.2f deg", id(cal2_angle_up));
  - platform: template
    name: "Calibrate ${side_slave}: set EMPTY MAX"
    entity_category: config
    web_server: {sorting_group_id: group_config, sorting_weight: 54}
    on_press:
      - lambda: |-
          id(cal2_angle_max) = id(current_angle2);
          id(cal2_max_done) = true;
          id(cal2_num_max).publish_state(id(cal2_angle_max));
          ESP_LOGI("cal", "SLAVE EMPTY MAX set to %.2f deg", id(cal2_angle_max));
  - platform: template
    name: "Calibrate ${side_slave}: set READY"
    entity_category: config
    web_server: {sorting_group_id: group_config, sorting_weight: 56}
    on_press:
      - lambda: |-
          id(cal2_angle_float) = id(current_angle2);
          id(cal2_float_done) = true;
          id(cal2_num_ready).publish_state(id(cal2_angle_float));
          ESP_LOGI("cal", "SLAVE READY set to %.2f deg", id(cal2_angle_float));
  - platform: template
    name: "Calibrate ${side_slave}: set GUIDE"
    entity_category: config
    web_server: {sorting_group_id: group_config, sorting_weight: 56.5}
    on_press:
      - lambda: |-
          id(cal2_angle_guide) = id(current_angle2);
          id(cal2_guide_done) = true;
          id(cal2_num_guide).publish_state(id(cal2_angle_guide));
          ESP_LOGI("cal", "SLAVE GUIDE set to %.2f deg", id(cal2_angle_guide));
  - platform: template
    name: "Calibrate ${side_slave}: set LOWERED"
    entity_category: config
    web_server: {sorting_group_id: group_config, sorting_weight: 57}
    on_press:
      - lambda: |-
          id(cal2_angle_down) = id(current_angle2);
          id(cal2_down_done) = true;
          id(cal2_num_lowered).publish_state(id(cal2_angle_down));
          ESP_LOGI("cal", "SLAVE LOWERED set to %.2f deg", id(cal2_angle_down));
  # (rev G: "Bench Test Cal Load" was removed — the live device is fully
  #  calibrated and one accidental press clobbered the real captures once
  #  already (2026-07-19, restored via the web API). Bench setpoints live in
  #  git history if a bench rig ever needs them again.)
  # (rev I: "Calibrate: capture LEVEL ref (pitch)" removed with the pitch proxy.)

# ---------------------------------------------------------------------------
#  HA command dropdown — one entity automations and scenes can set declaratively
#  ("select Lift" on departure) instead of pressing stateless buttons. Picking a
#  destination fires the SAME request_* script as the matching button, so every
#  interlock still applies. While a user-commanded move runs it reads as the
#  destination; at rest it reads "—" (selecting "—" does nothing), so re-picking
#  the same destination always fires. Built for HA — filed at the bottom of
#  Advanced on the web page, where the buttons remain the way to drive the lift.
# ---------------------------------------------------------------------------
select:
  - platform: template
    name: "Lift Command"
    id: lift_command_select
    icon: "mdi:swap-vertical-bold"
    options: ["—", "Lift", "Ready", "Guide", "Lower"]
    update_interval: 1s
    web_server: {sorting_group_id: group_advanced, sorting_weight: 80}
    lambda: |-
      if ((id(lift_state) == ${S_RAISING} || id(lift_state) == ${S_LOWERING})
          && id(user_cmd_move)) {
        switch (id(goto_mode)) {
          case ${M_LIFT}:  return std::string("Lift");
          case ${M_READY}: return std::string("Ready");
          case ${M_GUIDE}: return std::string("Guide");
          case ${M_LOWER}: return std::string("Lower");
        }
      }
      return std::string("—");
    set_action:
      - lambda: |-
          if      (x == "Lift")  id(request_goto_top)->execute();
          else if (x == "Ready") id(request_goto_ready)->execute();
          else if (x == "Guide") id(request_goto_guide)->execute();
          else if (x == "Lower") id(request_goto_lowered)->execute();

# ---------------------------------------------------------------------------
#  HA cover — everyday envelope only: raise/open = Lift, lower/close = Ready,
#  Stop = Stop. device_class blind (no tilt) so assistants say raise/lower
#  rather than treating it as a garage door. Position is Lift Height %
#  (0 = Lowered cal, 100 = Lift cal); above 95% latches fully open until
#  height falls below 93%, avoiding chatter near 95%. A partial set-position is ignored
#  — only the raise and lower commands move the lift. Full Lower stays on
#  Lift Command / the Lower button. No restore-and-call (that would move
#  on boot). State is published from the 250 ms tick.
# ---------------------------------------------------------------------------
cover:
  - platform: template
    name: "Lift Ready"
    id: lift_ready_cover
    device_class: blind
    icon: "mdi:arrow-up-down-bold"
    restore_mode: NO_RESTORE
    optimistic: false
    assumed_state: false
    has_position: true
    web_server: {sorting_group_id: group_control, sorting_weight: 5}
    open_action:
      - script.execute: request_goto_top
    close_action:
      - script.execute: request_goto_ready
    stop_action:
      - script.execute: request_stop
    position_action:
      - lambda: |-
          ESP_LOGW("cover", "set-position %.0f%% ignored — raise goes to Lift, lower goes to Ready",
                   pos * 100.0f);

# ---------------------------------------------------------------------------
#  Intents (request_*) — validate against state + interlocks, then transition.
#  Mode buttons: last press wins — accepted from rest OR mid-move (retarget /
#  reverse). Red/Stop always cancels motion and commands safe outputs.
#  Latched moves, no hold-to-run.
# ---------------------------------------------------------------------------
script:
  # ---- go-to-position core: pick raise vs lower from current height ----
  # Raising starts blower + valve TOGETHER (rev H) — no valve-opening interlock;
  # a few seconds of dead-heading against the opening valve is accepted by design.
  # Mid-move presses update the destination; direction may reverse if the new
  # target is on the other side of the live height.
  - id: do_goto
    parameters:
      target: float
      mode: int
    then:
      - lambda: |-
          // accepted from rest OR while moving (retarget). Not from FAULT/BYPASS/EMERG.
          int prev_s = id(lift_state);
          if (id(emerg_lock)) {
            ESP_LOGW("fsm", "goto: refused (emergency lock — Stop to acknowledge)");
            return;
          }
          if (prev_s != ${S_HOLD} && prev_s != ${S_LOWERED_VENT}
              && prev_s != ${S_RAISING} && prev_s != ${S_LOWERING}) return;
          if (!id(height_ok)) { ESP_LOGW("fsm","goto: no trusted angle"); return; }
          float cur = id(lift_pct);
          if (std::isnan(cur)) return;
          float tol = id(zone_tol_pct);
          bool was_moving = (prev_s == ${S_RAISING} || prev_s == ${S_LOWERING});
          id(rest_pulse) = 0;   // any go-to preempts an at-rest level pulse
          id(lowered_vent_stopped) = false;  // new mode releases Stop's Lowered seal
          id(goto_target_pct) = target; id(goto_mode) = mode; id(manual_move) = false;
          // clear leveling scratch on any (re)target (throttle/catch-up/shadow dedupe)
          id(level_catchup_start) = 0; id(level_since) = 0; id(level_shadow_want) = 0;

          bool in_zone = (mode == ${M_LOWER} && id(pos_at_lowered))
                      || (mode == ${M_READY} && id(pos_at_ready))
                      || (mode == ${M_GUIDE} && id(pos_at_guide))
                      || (mode == ${M_LIFT}  && !std::isnan(cur) && cur >= target - tol);
          int next_s;
          if (in_zone || !(cur < target - tol || cur > target + tol)) {
            // already there — rest (Lowered keeps the vent open)
            next_s = (mode == ${M_LOWER}) ? ${S_LOWERED_VENT} : ${S_HOLD};
          } else if (cur < target - tol) {
            next_s = ${S_RAISING};
          } else {
            next_s = ${S_LOWERING};
          }

          // arm move-scoped timers only when *entering* that direction
          if (next_s == ${S_RAISING} && prev_s != ${S_RAISING}) {
            id(blower_on_since) = millis();
            id(last_progress_angle) = id(height_angle);
            id(last_progress_time) = millis();
          }
          if (next_s == ${S_LOWERING} && prev_s != ${S_LOWERING}) {
            id(lower_start_time) = millis();
          }
          // retarget that lands already-at-target: mirror normal arrival side effects
          if (was_moving && (next_s == ${S_HOLD} || next_s == ${S_LOWERED_VENT})) {
            id(last_stop_reason) = "retarget already in zone";
            if (next_s == ${S_LOWERED_VENT}) {
              if (!id(boat_present)) ESP_LOGI("presence", "retarget LOWERED_VENT -> presence reset to presumed BOAT ON");
              id(boat_present) = true;
              id(boat_heavy) = true;
              id(boat_load_known) = false;
            }
          }
          id(lift_state) = next_s;

          const char* dir = (next_s == ${S_RAISING}) ? "raising"
                          : (next_s == ${S_LOWERING}) ? "lowering" : "already there";
          if (was_moving) {
            ESP_LOGI("fsm","retarget %.0f%% (mode %d): %s", target, mode, dir);
          } else if (next_s == ${S_HOLD} || next_s == ${S_LOWERED_VENT}) {
            ESP_LOGI("fsm","goto mode %d: already in zone", mode);
          } else {
            ESP_LOGI("fsm","goto %.0f%% (mode %d): %s", target, mode, dir);
          }
      - script.execute: apply_outputs

  # ---- DEGRADED / manual jog (angle offline): move with backstops only ----
  - id: manual_raise            # unreachable target -> stops on blower cap / Stop
    then:
      - lambda: |-
          int prev_s = id(lift_state);
          if (id(emerg_lock) || prev_s == ${S_EMERG}) return;
          if (prev_s != ${S_HOLD} && prev_s != ${S_LOWERED_VENT}
              && prev_s != ${S_RAISING} && prev_s != ${S_LOWERING}) return;
          id(lowered_vent_stopped) = false;
          id(goto_target_pct) = 200.0f; id(goto_mode) = ${M_LIFT}; id(manual_move) = true;
          if (prev_s != ${S_RAISING}) {
            id(blower_on_since) = millis();
            id(last_progress_angle) = id(current_angle);
            id(last_progress_time) = millis();
          }
          id(lift_state) = ${S_RAISING};
          ESP_LOGW("fsm","MANUAL raise (angle not trusted)%s",
                   (prev_s == ${S_LOWERING}) ? " [retarget reverse]" : "");
      - script.execute: apply_outputs

  - id: manual_lower            # unreachable target -> stops on lower-timeout / Stop
    then:
      - lambda: |-
          int prev_s = id(lift_state);
          if (id(emerg_lock) || prev_s == ${S_EMERG}) return;
          if (prev_s != ${S_HOLD} && prev_s != ${S_LOWERED_VENT}
              && prev_s != ${S_RAISING} && prev_s != ${S_LOWERING}) return;
          id(lowered_vent_stopped) = false;
          id(goto_target_pct) = -100.0f; id(goto_mode) = ${M_LOWER}; id(manual_move) = true;
          if (prev_s != ${S_LOWERING}) {
            id(lower_start_time) = millis();
          }
          id(lift_state) = ${S_LOWERING};
          ESP_LOGW("fsm","MANUAL lower (angle not trusted)%s",
                   (prev_s == ${S_RAISING}) ? " [retarget reverse]" : "");
      - script.execute: apply_outputs

  # ---- button intents: normal go-to when angle is good; manual jog when offline ----
  - id: request_goto_top
    then:
      - lambda: |-
          if (id(test_mode)) { ESP_LOGI("fsm","bench test: LIFT press ignored"); return; }
          id(user_cmd_move) = true;   // every request_* caller is a person
          if (id(height_ok)) {
            float tgt = id(lift_shutoff_pct);
            if (std::isnan(tgt)) tgt = id(top_target_pct).state;
            id(do_goto)->execute(tgt, ${M_LIFT});
          } else                   id(manual_raise)->execute();
  - id: request_goto_max        # retired alias — old panel LIFT_MAX / MAX → Lift
    then:
      - script.execute: request_goto_top
  - id: request_goto_lowered
    then:
      - lambda: |-
          if (id(test_mode)) { ESP_LOGI("fsm","bench test: LOWER press ignored"); return; }
          id(user_cmd_move) = true;
          if (id(height_ok)) id(do_goto)->execute(0.0f, ${M_LOWER});
          else               id(manual_lower)->execute();
  - id: request_goto_ready      # mid-position needs trusted position; no manual fallback
    then:
      - lambda: |-
          if (id(test_mode)) { ESP_LOGI("fsm","bench test: READY press ignored"); return; }
          id(user_cmd_move) = true;
          if (!id(height_ok)) { ESP_LOGW("fsm","Ready needs a trusted angle"); return; }
          if (!(id(height_src) == 2 ? id(cal2_float_done) : id(cal_float_done))) {
            ESP_LOGW("fsm","Ready not calibrated"); return;
          }
          if (std::isnan(id(ready_target_pct))) return;
          // Manual mode selection is authoritative: Ready is accepted from rest or
          // mid-move just like Lift and Lower. Load classification only constrains
          // unattended Ready maintenance; it never blocks an operator command.
          id(do_goto)->execute(id(ready_target_pct), ${M_READY});
  - id: request_goto_guide      # like Ready: trusted angle, captured setpoint, sealed rest
    then:
      - lambda: |-
          if (id(test_mode)) { ESP_LOGI("fsm","bench test: GUIDE press ignored"); return; }
          id(user_cmd_move) = true;
          if (!id(height_ok)) { ESP_LOGW("fsm","Guide needs a trusted angle"); return; }
          if (!(id(height_src) == 2 ? id(cal2_guide_done) : id(cal_guide_done))) {
            ESP_LOGW("fsm","Guide not calibrated"); return;
          }
          if (std::isnan(id(guide_target_pct))) return;
          id(do_goto)->execute(id(guide_target_pct), ${M_GUIDE});

  # Bunk inches -> one existing go-to. Inches are not linear in arm angle:
  # dh/dθ = −L·cos(θ), so a degree near horizontal (~0.9 in) buys more height
  # than a degree at the settled bottom (~0.55 in). Invert the same sine the
  # Bunk Height sensor uses. Arrival seals like Ready/Guide; this is not a
  # maintained park, and a target inside the Lowered band still follows the
  # existing vent-reopen rule.
  - id: request_goto_height
    then:
      - lambda: |-
          if (id(test_mode)) { ESP_LOGI("fsm","bench test: height go ignored"); return; }
          id(user_cmd_move) = true;
          if (!id(height_ok)) { ESP_LOGW("fsm","height go needs a trusted angle"); return; }
          bool on_port = id(height_src) == 2;
          if (!(on_port ? id(cal2_down_done) : id(cal_down_done))) {
            ESP_LOGW("fsm","height go: not calibrated"); return;
          }
          const float d2r = M_PI / 180.0f;
          const float L = ${arm_length_in}f;
          const float datum = ${bunk_lowered_waterline_in}f;
          float h = id(target_height_num).state;
          if (!std::isfinite(h) || L < 1.0f) return;
          float cal_down = on_port ? id(cal2_angle_down) : id(cal_angle_down);
          float s = sinf(cal_down * d2r) - (h - datum) / L;
          if (s < -1.0f || s > 1.0f) {
            ESP_LOGW("fsm","height go: %.1f in is outside the arm", h);
            return;
          }
          float theta = asinf(s) / d2r;
          float angle_top = on_port ? id(cal2_angle_up) : id(cal_angle_up);
          bool max_done = on_port ? id(cal2_max_done) : id(cal_max_done);
          float cal_max = on_port ? id(cal2_angle_max) : id(cal_angle_max);
          if (max_done && cal_max < angle_top) angle_top = cal_max;
          float angle_bottom = cal_down;
          if (theta > angle_bottom + 0.05f || theta < angle_top - 0.05f) {
            ESP_LOGW("fsm","height go: %.1f in -> %.2f deg outside calibrated stroke (%.2f..%.2f)",
                     h, theta, angle_top, angle_bottom);
            return;
          }
          float cal_up = on_port ? id(cal2_angle_up) : id(cal_angle_up);
          float span = cal_up - cal_down;
          if (fabsf(span) < 0.5f) return;
          float pct = (theta - cal_down) / span * 100.0f;
          ESP_LOGI("fsm","height go: %.1f in -> %.2f deg (%.1f%%)", h, theta, pct);
          id(do_goto)->execute(pct, ${M_HEIGHT});

  - id: request_stop
    then:
      # Universal red control: stop motion, abort leveling, close the Lowered vent,
      # clear FAULT, seal EMERG, or exit BYPASS. It never selects another mode.
      - lambda: |-
          if (id(test_mode)) {
            // Red button = universal kill even on the bench: blower off + valves
            // closed (bench switches follow), FSM stays suspended in test mode.
            id(blower_relay).turn_off();
            id(valve_power_open).turn_off();
            id(valve_power_open_b).turn_off();
            ESP_LOGW("fsm", "bench test: STOP press -> all outputs COMMANDED off (verify the blower actually stopped — a welded Y1 keeps running; breaker if so)");
            return;
          }
          id(lowered_vent_stopped) = true;
          if (id(lift_state) == ${S_EMERG} || id(emerg_lock)) {
            // operator override: seal NOW, latch the fault (second press clears -> HOLD)
            id(emerg_lock) = false;
            id(enter_fault)->execute("level_divergence - operator stop");
            ESP_LOGW("fsm", "request_stop during EMERGENCY -> sealed, FAULT latched");
          } else if (id(lift_state) == ${S_FAULT}) {
            id(fault_reason) = "";
            id(rest_pulse) = 0;
            id(lift_state) = ${S_HOLD};   // clear FAULT -> HOLD
            ESP_LOGI("fsm", "request_stop -> clear FAULT -> HOLD");
          } else if (id(lift_state) == ${S_BYPASS}) {
            id(bypass_mode_switch).publish_state(false);
            id(rest_pulse) = 0;
            id(lift_state) = ${S_HOLD};
            ESP_LOGI("fsm", "request_stop -> exit BYPASS -> HOLD");
          } else if (id(lift_state) == ${S_RAISING} || id(lift_state) == ${S_LOWERING}
                     || id(lift_state) == ${S_HOLD} || id(lift_state) == ${S_LOWERED_VENT}) {
            id(rest_pulse) = 0;
            id(lift_state) = ${S_HOLD};
            id(last_stop_reason) = "Stop pressed";
            ESP_LOGI("fsm", "request_stop -> HOLD");
          }
      - script.execute: apply_outputs

  # ---- BYPASS: manual override — open valve, blower off, sit hands-off ----
  - id: enter_bypass
    then:
      - lambda: |-
          if (id(test_mode)) { ESP_LOGI("fsm","bench test: bypass ignored"); return; }
          if (id(lift_state) == ${S_EMERG} || id(emerg_lock)) return;
          if (id(lift_state) == ${S_BYPASS}) return;       // already in bypass
          id(manual_move) = false;
          id(rest_pulse) = 0;
          id(boat_present) = true;   // hands-off manual: anything can happen -> presence unknown = presumed ON
          id(boat_heavy) = true;     // fail-safe: presume tower boat until reclassified
          id(boat_load_known) = false;
          id(lift_state) = ${S_BYPASS};          // BYPASS: apply_outputs opens valve, blower off
          ESP_LOGW("fsm", "BYPASS engaged -> valve OPEN, blower OFF (hands-off)");
      - lambda: 'id(bypass_mode_switch).publish_state(true);'
      - script.execute: apply_outputs

  - id: exit_bypass
    then:
      - lambda: |-
          if (id(lift_state) == ${S_BYPASS}) {
            id(lift_state) = ${S_HOLD};
            ESP_LOGI("fsm", "BYPASS cleared -> HOLD");
          }
      - lambda: 'id(bypass_mode_switch).publish_state(false);'
      - script.execute: apply_outputs

  # (rev G: request_reset was removed — it was a strict subset of request_stop,
  #  which clears a latched FAULT and exits BYPASS; panel req=RESET maps there.)

  - id: enter_fault
    parameters:
      reason: string
    then:
      - lambda: |-
          if (id(lift_state) != ${S_FAULT}) {
            id(fault_reason) = reason;
            id(rest_pulse) = 0;
            id(emerg_lock) = false;
            id(emerg_ready_since) = 0;
            id(lift_state) = ${S_FAULT};
            id(last_stop_reason) = std::string("FAULT: ") + reason;
            ESP_LOGE("fsm", "FAULT: %s", reason.c_str());
          }
      - script.execute: apply_outputs

  # ADR-015: above Ready → EMERG_DESCEND; at/below Ready → FAULT + seal.
  # Shared by the 3° hard stop, a rest-level pulse that is not winning, and
  # in-move catch-up. Stall still calls enter_fault directly.
  - id: start_emergency_descent
    parameters:
      reason: string
    then:
      - lambda: |-
          if (id(test_mode)) return;
          if (id(lift_state) == ${S_FAULT} || id(lift_state) == ${S_EMERG}) return;
          if (id(emerg_lock)) return;
          // ADR-018: a power-up list is not a hose-off. test_inject is the
          // explicit bench bypass (the switch itself is ALWAYS_OFF on boot).
          if (reason != "test_inject" && !id(level_settle_hard)) {
            ESP_LOGW("level", "automatic descent suppressed during IMU settle (%s)", reason.c_str());
            return;
          }
          bool boat_high = !std::isnan(id(ready_target_pct)) && !std::isnan(id(lift_pct))
                           && id(lift_pct) > id(ready_target_pct) + id(zone_tol_pct);
          if (!boat_high) {
            id(enter_fault)->execute(reason);
            return;
          }
          id(rest_pulse) = 0;
          id(level_throttle) = 0;
          id(manual_move) = false;
          id(user_cmd_move) = false;
          id(emerg_lock) = false;
          id(emerg_ready_since) = 0;
          id(goto_mode) = ${M_READY};
          id(lower_start_time) = millis();
          id(lift_state) = ${S_EMERG};
          id(last_stop_reason) = std::string("EMERGENCY descent: ") + reason;
          ESP_LOGE("level", "EMERGENCY DESCENT: %s — venting both sides to Ready, blower off",
                   reason.c_str());
          id(apply_outputs)->execute();

  # ---- THE single place outputs are written. Outputs = f(state, rest_pulse). ----
  - id: apply_outputs
    mode: single
    then:
      - lambda: |-
          // Bench test mode: suspend FSM output writes so outputs can be toggled by hand.
          if (id(test_mode)) return;
          int s = id(lift_state);
          bool blower = false, v_base = false;
          if (s == ${S_RAISING}) { v_base = true;  blower = true;  }   // blower + valves together (rev H)
          else if (s == ${S_LOWERING} || s == ${S_BYPASS} || s == ${S_LOWERED_VENT}
                   || s == ${S_EMERG}) { v_base = true; }   // EMERG: both valves ganged open, blower off
          // HOLD / FAULT: make_safe -> blower off, valves closed — unless an
          // at-rest level pulse is active (HOLD + rest_pulse 1..4).

          // Leveling bias: both valves follow the state, then the throttled
          // side (decided by the 250 ms supervisor) is closed while moving.
          // level_throttle is single-valued, so both valves can never be
          // throttled shut at once.
          bool va = v_base, vb = v_base;
          if (s == ${S_RAISING} || s == ${S_LOWERING}) {
            if (id(level_throttle) == 1) va = false;        // feed/vent slave side only
            else if (id(level_throttle) == 2) vb = false;   // feed/vent master side only
          }

          // §21.6 at-rest level pulse while parked at Lift (still HOLD in the FSM).
          // 1=feed master, 2=feed slave, 3=vent slave, 4=vent master
          int rp = id(rest_pulse);
          if (s == ${S_HOLD} && rp != 0) {
            if (rp == 1)      { blower = true;  va = true;  vb = false; }
            else if (rp == 2) { blower = true;  va = false; vb = true;  }
            else if (rp == 3) { blower = false; va = false; vb = true;  }
            else if (rp == 4) { blower = false; va = true;  vb = false; }
          }

          // Auto-return valves: energized = open, off = spring/auto return closed.
          // Blower and valves are commanded independently (no sequencing); when
          // making safe, drop the blower before removing valve power.
          if (blower) {
            if (va) id(valve_power_open).turn_on();   else id(valve_power_open).turn_off();
            if (vb) id(valve_power_open_b).turn_on(); else id(valve_power_open_b).turn_off();
            id(blower_relay).turn_on();
          } else {
            id(blower_relay).turn_off();
            if (va) id(valve_power_open).turn_on();   else id(valve_power_open).turn_off();
            if (vb) id(valve_power_open_b).turn_on(); else id(valve_power_open_b).turn_off();
          }
          // Command-edge timestamps: pair with the valve_fb end-stop events to
          // split relay-to-motion dead time from actuator travel time.
          {
            static bool p_va = false, p_vb = false, p_bl = false;
            if (va != p_va) ESP_LOGI("valve_cmd", "Y2 %s (relay %s)", va ? "OPEN" : "CLOSE", va ? "energized" : "released");
            if (vb != p_vb) ESP_LOGI("valve_cmd", "Y3 %s (relay %s)", vb ? "OPEN" : "CLOSE", vb ? "energized" : "released");
            if (blower != p_bl) ESP_LOGI("valve_cmd", "Y1 blower %s", blower ? "ON" : "OFF");
            p_va = va; p_vb = vb; p_bl = blower;
          }
          // (button LEDs handled by the dedicated 100 ms LED interval)

# ---------------------------------------------------------------------------
#  Control tick — supervisor + FSM advance, every 250 ms.
#  Order: freshness -> height -> per-state logic -> apply_outputs.
# ---------------------------------------------------------------------------
interval:
  # ---- WT901 stream parser: assemble 0x55-framed 11-byte packets, decode 0x53 (angle) ----
  - interval: 50ms
    then:
      - lambda: |-
          static uint8_t buf[11];
          static uint8_t idx = 0;
          while (id(wit_uart).available()) {
            uint8_t b;
            if (!id(wit_uart).read_byte(&b)) break;
            if (idx == 0) {
              if (b == 0x55) buf[idx++] = b;     // wait for frame header
            } else {
              buf[idx++] = b;
              if (idx >= 11) {
                idx = 0;
                uint8_t sum = 0;
                for (int i = 0; i < 10; i++) sum += buf[i];
                if (sum == buf[10]) {
                  if (buf[1] == 0x53) {            // Angle frame
                    int16_t r = (int16_t)((buf[3] << 8) | buf[2]);
                    int16_t p = (int16_t)((buf[5] << 8) | buf[4]);
                    id(angle_roll)  = r / 32768.0f * 180.0f;
                    id(angle_pitch) = p / 32768.0f * 180.0f;
                    // FSM angle = arm-swing axis (default Roll; confirm at commissioning)
                    id(current_angle) = id(angle_roll);
                    id(angle_last_update) = millis();
                  }
                }
              }
            }
          }

  # ---- WT901 #2 (SLAVE) stream parser — identical framing, its own buffer ----
  - interval: 50ms
    then:
      - lambda: |-
          static uint8_t buf2[11];
          static uint8_t idx2 = 0;
          while (id(wit2_uart).available()) {
            uint8_t b;
            if (!id(wit2_uart).read_byte(&b)) break;
            if (idx2 == 0) {
              if (b == 0x55) buf2[idx2++] = b;     // wait for frame header
            } else {
              buf2[idx2++] = b;
              if (idx2 >= 11) {
                idx2 = 0;
                uint8_t sum = 0;
                for (int i = 0; i < 10; i++) sum += buf2[i];
                if (sum == buf2[10]) {
                  if (buf2[1] == 0x53) {           // Angle frame
                    int16_t r = (int16_t)((buf2[3] << 8) | buf2[2]);
                    int16_t p = (int16_t)((buf2[5] << 8) | buf2[4]);
                    id(angle2_roll)  = r / 32768.0f * 180.0f;
                    id(angle2_pitch) = p / 32768.0f * 180.0f;
                    // slave arm-swing axis (default Roll; confirm at commissioning)
                    id(current_angle2) = id(angle2_roll);
                    id(angle2_last_update) = millis();
                  }
                }
              }
            }
          }

  # ---- Button ring LEDs.
  # White / Ready / Lower stay lit so the choices are visible. The destination
  # of a person-commanded move (or an emergency descent) slow-flashes until it
  # ends. Red is dark when the lift is healthy.
  #   even flash (~2.5 Hz)     fault, emergency, bypass — press red to clear
  #   3 s flash / 10 s dark    an IMU is untrusted (go-to still works on the other)
  #   slow double-blink        Wi-Fi down, and nothing above is wrong
  # Bypass turns the three position rings off so a venting lift is not a normal night.
  - interval: 100ms
    then:
      - lambda: |-
          bool flash = ((millis() / 200) % 2) == 0;        // even — press red
          bool flash_slow = ((millis() / 600) % 2) == 0;   // destination in progress
          int phase = (int) ((millis() / 100) % 20);       // double-blink over 2 s
          bool wifi_pulse = (phase == 0 || phase == 1 || phase == 3 || phase == 4);
          bool sensor_gap = ((millis() % 13000UL) < 3000UL) && flash;
          int s = id(lift_state);
          bool bypass = (s == ${S_BYPASS});
          bool moving = (s == ${S_RAISING} || s == ${S_LOWERING});
          bool emerg  = (s == ${S_EMERG}) || id(emerg_lock);
          bool latch  = bypass || (s == ${S_FAULT}) || emerg;
          bool sensor_bad = !id(angle_trusted) || (id(have_cal2) && !id(angle2_trusted));
          bool show_dest = !bypass && (s == ${S_EMERG}
              || (moving && (id(user_cmd_move) || id(manual_move))));
          int mode = id(goto_mode);
          bool top_on = !bypass && !(show_dest && mode == ${M_LIFT} && !flash_slow);
          bool rdy_on = !bypass && !(show_dest && mode == ${M_READY} && !flash_slow);
          bool low_on = !bypass && !(show_dest && mode == ${M_LOWER} && !flash_slow);
          bool stop_on;
          if (latch)                 stop_on = flash;
          else if (sensor_bad)       stop_on = sensor_gap;
          else if (!id(wifi_sta).is_connected()) stop_on = wifi_pulse;
          else                       stop_on = false;
          (top_on  ? id(led_top).turn_on()     : id(led_top).turn_off());
          (rdy_on  ? id(led_ready).turn_on()   : id(led_ready).turn_off());
          (low_on  ? id(led_lowered).turn_on() : id(led_lowered).turn_off());
          (stop_on ? id(led_stop).turn_on()    : id(led_stop).turn_off());

  - interval: 250ms
    then:
      - lambda: |-
          unsigned long now = millis();

          // ---- ABSOLUTE blower runtime cap (all modes, incl. manual bench test) ----
          // Guarantees the blower can never get stuck on, however it was turned on.
          bool blwr = id(blower_relay).state;
          if (blwr && !id(blower_was_on)) id(blower_run_since) = now;   // rising edge
          id(blower_was_on) = blwr;
          if (blwr && (now - id(blower_run_since)) >
                      (unsigned long)(id(blower_max_minutes).state * 60000.0f)) {
            if (id(test_mode)) {              // manual: just force the relay off
              id(blower_relay).turn_off();
              ESP_LOGW("safety", "blower max runtime reached -> forced OFF (manual)");
            } else {                          // FSM-driven: fault so apply_outputs makes safe
              id(enter_fault)->execute("blower_max_runtime");
            }
          }

          // ---- angle freshness + sanity ----
          unsigned long fresh_ms = (unsigned long)(id(angle_fresh_seconds).state * 1000.0f);
          bool fresh = (now - id(angle_last_update)) < fresh_ms && id(angle_last_update) != 0;
          // arm swing stays well inside ±90 whatever the sensor mounting/sign;
          // beyond ±95 the reading is nonsense -> invalid
          bool in_range = (id(current_angle) > -95.0f && id(current_angle) < 95.0f);
          id(angle_valid) = fresh && in_range;

          // ---- height percent + derived targets — THE single source (rev H).
          //      Everything else (status, LEDs, observer, panel link, do_goto)
          //      reads have_cal / lift_pct / zone_tol_pct / ready_target_pct. ----
          float span = id(cal_angle_up) - id(cal_angle_down);
          id(have_cal) = id(cal_up_done) && id(cal_down_done) && fabs(span) > 0.5f;
          id(lift_pct) = id(have_cal)
                      ? (id(current_angle) - id(cal_angle_down)) / span * 100.0f : NAN;
          id(zone_tol_pct) = id(have_cal)
                      ? id(zone_tol_deg).state / fabs(span) * 100.0f : 0.0f;
          id(ready_target_pct) = (id(have_cal) && id(cal_float_done))
                      ? (id(cal_angle_float) - id(cal_angle_down)) / span * 100.0f : NAN;
          id(guide_target_pct) = (id(have_cal) && id(cal_guide_done))
                      ? (id(cal_angle_guide) - id(cal_angle_down)) / span * 100.0f : NAN;
          // Lift shutoff: confirmed empty uses Empty Max; any boat / unknown uses
          // the boat (Cobalt) ceiling. Lift Target % is the always-reach fraction.
          if (id(have_cal)) {
            float frac = id(top_target_pct).state / 100.0f;
            float boat_tgt = id(top_target_pct).state;
            float empty_tgt = boat_tgt;
            if (id(cal_max_done) && fabs(span) > 0.5f)
              empty_tgt = (id(cal_angle_max) - id(cal_angle_down)) / span * 100.0f * frac;
            bool empty = id(boat_load_known) && !id(boat_present);
            id(lift_shutoff_pct) = empty ? empty_tgt : boat_tgt;
          } else {
            id(lift_shutoff_pct) = NAN;
          }

          // ---- angle TRUST: valid AND within the calibrated arm range (+ margin) ----
          bool x_plausible = true;
          if (id(have_cal)) {
            float lo = id(cal_angle_down);
            float hi = id(cal_angle_down);
            if (id(cal_angle_up) < lo) lo = id(cal_angle_up);
            if (id(cal_angle_up) > hi) hi = id(cal_angle_up);
            if (id(cal_max_done)) {
              if (id(cal_angle_max) < lo) lo = id(cal_angle_max);
              if (id(cal_angle_max) > hi) hi = id(cal_angle_max);
            }
            float m = id(angle_margin_deg).state;
            x_plausible = (id(current_angle) >= lo - m && id(current_angle) <= hi + m);
          }
          id(angle_trusted) = id(angle_valid) && x_plausible;

          // ---- position zones (single Zone Tolerance knob, rev H) ----
          // Lowered is one-sided: at the lowered cal OR settled beyond it. Valid for the
          // confirmed sensor sign (lowered = positive/high angle, raising goes negative).
          id(pos_at_lowered) = id(cal_down_done) && id(angle_valid)
              && id(current_angle) > (id(cal_angle_down) - id(zone_tol_deg).state);
          id(pos_at_ready) = id(cal_float_done) && id(angle_valid)
              && fabs(id(current_angle) - id(cal_angle_float)) <= id(zone_tol_deg).state;
          id(pos_at_guide) = id(cal_guide_done) && id(angle_valid)
              && fabs(id(current_angle) - id(cal_angle_guide)) <= id(zone_tol_deg).state;
          id(pos_at_max) = id(cal_max_done) && id(angle_valid)
              && fabs(id(current_angle) - id(cal_angle_max)) <= id(zone_tol_deg).state;
          id(pos_at_top) = id(angle_valid) && !std::isnan(id(lift_pct))
              && id(lift_pct) >= id(top_target_pct).state - id(zone_tol_pct);

          // ================= LEVELING SUPERVISOR =================
          // ---- slave (IMU #2) freshness + sanity + trust — mirrors the master ----
          bool fresh2 = (now - id(angle2_last_update)) < fresh_ms && id(angle2_last_update) != 0;
          bool in_range2 = (id(current_angle2) > -95.0f && id(current_angle2) < 95.0f);
          id(angle2_valid) = fresh2 && in_range2;

          // slave height % — computed ONCE here (rev-H idiom): have_cal2 / slave_pct
          float span2 = id(cal2_angle_up) - id(cal2_angle_down);
          id(have_cal2) = id(cal2_up_done) && id(cal2_down_done) && fabs(span2) > 0.5f;
          id(slave_pct) = id(have_cal2)
                      ? (id(current_angle2) - id(cal2_angle_down)) / span2 * 100.0f : NAN;
          bool x2_plausible = true;
          if (id(have_cal2)) {
            float lo2 = id(cal2_angle_down), hi2 = id(cal2_angle_down);
            if (id(cal2_angle_up) < lo2) lo2 = id(cal2_angle_up);
            if (id(cal2_angle_up) > hi2) hi2 = id(cal2_angle_up);
            if (id(cal2_max_done)) {
              if (id(cal2_angle_max) < lo2) lo2 = id(cal2_angle_max);
              if (id(cal2_angle_max) > hi2) hi2 = id(cal2_angle_max);
            }
            float m2 = id(angle_margin_deg).state;
            x2_plausible = (id(current_angle2) >= lo2 - m2 && id(current_angle2) <= hi2 + m2);
          }
          id(angle2_trusted) = id(angle2_valid) && x2_plausible;

          // ---- height authority (ADR-017): starboard when it is trusted,
          //      otherwise port. Percent targets and zones follow that sensor
          //      so a mid-move failover stays in one percent space. ----
          {
            int prev_src = id(height_src);
            int src = 0;
            if (id(angle_trusted) && id(have_cal)) src = 1;
            else if (id(angle2_trusted) && id(have_cal2)) src = 2;
            if (src == 2) {
              float span_p = id(cal2_angle_up) - id(cal2_angle_down);
              id(lift_pct) = id(slave_pct);
              id(zone_tol_pct) = id(zone_tol_deg).state / fabsf(span_p) * 100.0f;
              id(ready_target_pct) = id(cal2_float_done)
                  ? (id(cal2_angle_float) - id(cal2_angle_down)) / span_p * 100.0f : NAN;
              id(guide_target_pct) = id(cal2_guide_done)
                  ? (id(cal2_angle_guide) - id(cal2_angle_down)) / span_p * 100.0f : NAN;
              float frac = id(top_target_pct).state / 100.0f;
              float boat_tgt = id(top_target_pct).state;
              float empty_tgt = boat_tgt;
              if (id(cal2_max_done))
                empty_tgt = (id(cal2_angle_max) - id(cal2_angle_down)) / span_p * 100.0f * frac;
              bool empty_load = id(boat_load_known) && !id(boat_present);
              id(lift_shutoff_pct) = empty_load ? empty_tgt : boat_tgt;
              float tol = id(zone_tol_deg).state;
              id(pos_at_lowered) = id(cal2_down_done) && id(angle2_valid)
                  && id(current_angle2) > (id(cal2_angle_down) - tol);
              id(pos_at_ready) = id(cal2_float_done) && id(angle2_valid)
                  && fabsf(id(current_angle2) - id(cal2_angle_float)) <= tol;
              id(pos_at_guide) = id(cal2_guide_done) && id(angle2_valid)
                  && fabsf(id(current_angle2) - id(cal2_angle_guide)) <= tol;
              id(pos_at_max) = id(cal2_max_done) && id(angle2_valid)
                  && fabsf(id(current_angle2) - id(cal2_angle_max)) <= tol;
              id(pos_at_top) = id(angle2_valid) && !std::isnan(id(lift_pct))
                  && id(lift_pct) >= id(top_target_pct).state - id(zone_tol_pct);
              id(height_angle) = id(current_angle2);
            } else {
              id(height_angle) = id(current_angle);
            }
            id(height_ok) = (src != 0);
            if ((prev_src == 1 || prev_src == 2) && src != prev_src) {
              ESP_LOGW("height", "angle source %s -> %s",
                       prev_src == 1 ? "starboard" : "port",
                       src == 1 ? "starboard" : src == 2 ? "port" : "none");
              id(last_progress_angle) = id(height_angle);
              id(last_progress_time) = now;
              id(obs_height_filt) = -1000.0f;
              id(obs_rate_last_t) = 0;
              id(obs_sag_rate) = 0.0f;
              id(seal_ref_filt) = -999.0f;
              int smv = id(lift_state);
              bool moving_now = (smv == ${S_RAISING} || smv == ${S_LOWERING}) && !id(manual_move);
              if (moving_now && src != 0 && id(goto_mode) == ${M_HEIGHT}) {
                id(lift_state) = ${S_HOLD};
                id(last_stop_reason) = "height source changed";
                ESP_LOGW("height", "inch target was in the other sensor's percent — STOP");
              } else if (moving_now && src != 0) {
                float tgt = id(goto_target_pct);
                if (id(goto_mode) == ${M_LIFT}) tgt = id(lift_shutoff_pct);
                else if (id(goto_mode) == ${M_READY}) tgt = id(ready_target_pct);
                else if (id(goto_mode) == ${M_GUIDE}) tgt = id(guide_target_pct);
                else if (id(goto_mode) == ${M_LOWER}) tgt = 0.0f;
                if (!std::isnan(tgt)) {
                  ESP_LOGW("height", "retarget %.1f%% -> %.1f%%", id(goto_target_pct), tgt);
                  id(goto_target_pct) = tgt;
                }
              }
            }
            id(height_src) = src;
          }

          // ---- level error in calibrated % space: + = slave side HIGH ----
          bool lok = id(angle_trusted) && id(angle2_trusted) && id(have_cal2)
                     && !std::isnan(id(lift_pct)) && !std::isnan(id(slave_pct));
          id(level_ok_now) = lok;
          bool had_level_trust = id(level_ok_since) != 0;
          if (lok) {
            float e = id(slave_pct) - id(lift_pct);
            float a2 = 0.25f / 3.0f;          // ~3 s EMA (waves largely cancel in the difference)
            id(level_err_filt) = a2 * e + (1.0f - a2) * id(level_err_filt);
          } else if (had_level_trust) {
            id(level_err_filt) = 0.0f;        // drop a startup/dropout spike; do not carry it
            ESP_LOGW("level", "level trust lost — IMU settle reset, valves stay closed");
          }

          // ---- ADR-018 boot settle. 2026-10-08 power restore opened both
          //      vents at Lift: an early frame looked like Lowered, and the
          //      list was still 3.8° at 11 s so the old 8 s hard-stop grace
          //      had already expired. Automatic vent waits for 20 s of list
          //      under Tilt Critical. A list that never calms arms the hard
          //      stop at 60 s. After that, a hose burst still trips on the
          //      next tick. ----
          float err_deg = lok && id(have_cal)
                        ? fabs(id(level_err_filt)) * fabs(span) / 100.0f : NAN;
          bool list_under = lok && !std::isnan(err_deg)
                            && err_deg <= id(tilt_critical_deg).state;
          ultralift::SettleClocks settle_clocks;
          settle_clocks.trust_since = static_cast<std::uint32_t>(id(level_ok_since));
          settle_clocks.calm_since = static_cast<std::uint32_t>(id(level_calm_since));
          settle_clocks.hard_latched = id(level_settle_hard);
          ultralift::SettleGate settle = ultralift::boot_settle(
              lok, list_under, static_cast<std::uint32_t>(now), settle_clocks);
          bool was_vent = id(level_settle_vent);
          bool was_hard = id(level_settle_hard);
          id(level_ok_since) = settle_clocks.trust_since;
          id(level_calm_since) = settle_clocks.calm_since;
          id(level_settle_vent) = settle.auto_vent_allowed;
          id(level_settle_hard) = settle.hard_stop_armed;
          if (lok && !had_level_trust)
            ESP_LOGI("level", "both IMUs trusted — automatic vent waits for 20 s of calm list");
          if (settle.auto_vent_allowed && !was_vent)
            ESP_LOGI("level", "IMU list calm for 20 s — lowered vent and rest-level armed");
          else if (settle.hard_stop_armed && !was_hard)
            ESP_LOGW("level", "IMU settle force-armed at 60 s — list never calmed, hard stop live");

          // §16.2 HARD STOP (ADR-015), gated by the settle above.
          // start_emergency_descent: boat HIGH → ganged vent; at/below Ready
          // → FAULT + seal. Inject skips the wait; the switch is off on boot.
          bool inject = id(test_inject_level_fail).state;
          if (lok && (settle.hard_stop_armed || inject) && id(have_cal) && !id(test_mode)
              && (inject || (!std::isnan(err_deg) && err_deg > id(tilt_critical_deg).state))
              && id(lift_state) != ${S_FAULT} && id(lift_state) != ${S_EMERG}
              && !id(emerg_lock)) {
            if (inject) {
              id(test_inject_level_fail).publish_state(false);
              ESP_LOGW("level", "TEST INJECT: forcing level-fail path at %.0f%% (live list %.1f deg)",
                       id(lift_pct), err_deg);
              id(start_emergency_descent)->execute("test_inject");
            } else {
              ESP_LOGE("level", "LEVEL HARD STOP: sides diverged %.1f deg (> %.1f) at %.0f%%",
                       err_deg, id(tilt_critical_deg).state, id(lift_pct));
              id(start_emergency_descent)->execute("level_divergence");
            }
          }

          // ---- throttle decision: close the valve of whichever side is AHEAD ----
          // Applies only while RAISING/LOWERING on a position-targeted move.
          // Maintain Level OFF => decisions are computed + logged as LEVEL(shadow)
          // but level_throttle stays 0 (valves ganged = v1).
          {
            int s0 = id(lift_state);
            bool moving23 = (s0 == ${S_RAISING} || s0 == ${S_LOWERING});
            int want = 0;
            if (moving23 && lok && !id(manual_move)) {
              float db = id(level_deadband_pct).state;
              float rel = db - id(level_hysteresis_pct).state;
              if (rel < 0.0f) rel = 0.0f;
              float e = id(level_err_filt);
              int cur = (id(auto_level_switch).state) ? id(level_throttle) : id(level_shadow_want);
              // engage above the deadband; once engaged, release inside deadband - hysteresis
              float trip = (cur == 0) ? db : rel;
              if (e > trip)       want = (s0 == ${S_RAISING}) ? 2 : 1;  // slave HIGH: raise->close slave, lower->close master
              else if (e < -trip) want = (s0 == ${S_RAISING}) ? 1 : 2;  // slave LOW:  raise->close master, lower->close slave
            }
            if (id(auto_level_switch).state) {
              if (want != id(level_throttle)) {
                unsigned long hold_ms = (unsigned long)(id(level_min_hold_s).state * 1000.0f);
                if (id(level_throttle) == 0 || want == 0 || (now - id(level_since)) >= hold_ms) {
                  ESP_LOGW("level", "LEVEL: throttle %s (err %.1f%%)",
                           want == 1 ? "MASTER valve (feed/vent slave)" :
                           want == 2 ? "SLAVE valve (feed/vent master)" : "released",
                           id(level_err_filt));
                  id(level_throttle) = want;
                  id(level_since) = now;
                  // reset the stall tracker onto the newly fed side
                  id(last_progress_angle) = (want == 1) ? id(current_angle2) : id(current_angle);
                  id(last_progress_time) = now;
                }
              }
            } else {
              id(level_throttle) = 0;   // valves ganged
              if (want != id(level_shadow_want)) {
                ESP_LOGI("level", "LEVEL(shadow): would throttle %s (err %.1f%%)",
                         want == 1 ? "MASTER valve" : want == 2 ? "SLAVE valve" : "nothing",
                         id(level_err_filt));
                id(level_shadow_want) = want;
              }
            }
            if (!moving23) { id(level_throttle) = 0; id(level_shadow_want) = 0; }
            else if (id(rest_pulse) != 0) {
              id(rest_pulse) = 0;   // commanded move preempts any rest pulse
            }

            // ---- §21.6 at-rest level keeper (Lift only; Maintain Level ON).
            //      Height maintain has priority: if master is below the sag
            //      deadband, do not start (or abort) a rest pulse — the height
            //      top-up raise will level as a side effect via in-move throttle.
            //      ADR-015: air budget is a *not-winning* detector only (feed
            //      30 s / vent 10 s with no shrink → fail-safe). If the list
            //      is shrinking, keep going until the same release as in-move
            //      (deadband − hysteresis) or the vent height floor / 3°.
            //      Dock 2026-09-10: a winning 10 s vent stopped at 2.7% in
            //      the 2–3% hole and never retried. ----
            {
              const unsigned long FEED_MS = 30000UL;      // air budget, not relay-on
              const unsigned long VENT_MS = 10000UL;
              const unsigned long AIR_GRACE_MS = 8000UL;  // actuator open dead time
              const unsigned long REST_GAP_MS = 60000UL;  // min off-time between pulses
              const float WIN_PCT = 0.5f;                 // |err| must shrink by this
              bool at_lift_only = (s0 == ${S_HOLD}) && id(pos_at_top);
              float lift_sp = std::isnan(id(lift_shutoff_pct))
                            ? id(top_target_pct).state : id(lift_shutoff_pct);
              bool height_ok = !std::isnan(id(lift_pct))
                               && id(lift_pct) >= lift_sp
                                              - id(maintain_sag_deadband).state;
              bool lvl_on = id(auto_level_switch).state && !id(test_mode);

              // manage an active pulse
              if (id(rest_pulse) != 0) {
                bool abort = !at_lift_only || !lok || !lvl_on || !height_ok;
                bool feed = id(rest_pulse) <= 2;
                bool v_open = (id(rest_pulse) == 1 || id(rest_pulse) == 4)
                            ? id(valve_fb_open).state : id(valve_b_fb_open).state;
                if (id(rest_pulse_air_since) == 0
                    && (v_open || (now - id(rest_pulse_since)) >= AIR_GRACE_MS)) {
                  id(rest_pulse_air_since) = now;
                  id(rest_pulse_err_at_air) = id(level_err_filt);
                }
                bool air_on = id(rest_pulse_air_since) != 0;
                unsigned long air_ms = air_on ? (now - id(rest_pulse_air_since)) : 0;
                unsigned long lim = feed ? FEED_MS : VENT_MS;
                bool timed_out = air_on && air_ms >= lim;
                bool winning = air_on && lok
                    && (fabs(id(level_err_filt)) + WIN_PCT < fabs(id(rest_pulse_err_at_air)));
                bool growing = air_on && lok
                    && (fabs(id(level_err_filt)) > fabs(id(rest_pulse_err_at_air)) + WIN_PCT);
                // vent floor: never trade Lift height away
                if (id(rest_pulse) >= 3 && !std::isnan(id(lift_pct))
                    && id(lift_pct) < lift_sp - id(zone_tol_pct)) {
                  abort = true;
                  ESP_LOGW("level", "REST-LEVEL: vent aborted (height floor)");
                }
                // Same finish line as a raise/lower throttle release.
                float rel = id(level_deadband_pct).state
                            - id(level_hysteresis_pct).state;
                if (rel < 0.0f) rel = 0.0f;
                bool leveled = lok && fabs(id(level_err_filt)) <= rel;
                bool give_up = false;
                if (!abort && !leveled && air_on) {
                  if (!std::isnan(err_deg) && err_deg > id(tilt_critical_deg).state) {
                    give_up = true;
                    ESP_LOGE("level", "REST-LEVEL: abort angle %.1f deg -> fail-safe", err_deg);
                  } else if (!feed && growing) {
                    give_up = true;
                    ESP_LOGE("level", "REST-LEVEL: vent grew error -> fail-safe");
                  } else if (feed && air_ms > 15000UL && !winning) {
                    float fed = (id(rest_pulse) == 1) ? id(current_angle) : id(current_angle2);
                    float dir = (id(rest_pulse) == 1)
                              ? ((span >= 0.0f) ? 1.0f : -1.0f)
                              : ((span2 >= 0.0f) ? 1.0f : -1.0f);
                    if ((fed - id(rest_pulse_start_angle)) * dir < 0.15f) {
                      give_up = true;
                      ESP_LOGE("level", "REST-LEVEL: feed no progress -> fail-safe");
                    }
                  } else if (timed_out && !winning) {
                    give_up = true;
                    ESP_LOGE("level", "REST-LEVEL: %s air not shrinking -> fail-safe",
                             feed ? "30s" : "10s vent");
                  }
                }
                if (give_up) {
                  id(rest_pulse) = 0;
                  id(rest_pulse_air_since) = 0;
                  id(rest_last_pulse_ms) = now;
                  id(rest_level_below_since) = 0;
                  id(start_emergency_descent)->execute("level_correct_fail");
                } else if (abort || leveled) {
                  ESP_LOGI("level", "REST-LEVEL: pulse end (%s) err %+.1f%%",
                           abort ? "abort" : "leveled",
                           id(level_err_filt));
                  id(rest_pulse) = 0;
                  id(rest_pulse_air_since) = 0;
                  id(rest_last_pulse_ms) = now;
                  id(rest_level_below_since) = 0;
                }
              } else if (at_lift_only && lok && lvl_on && height_ok && id(level_settle_vent)) {
                bool past = fabs(id(level_err_filt)) > id(rest_level_trigger_pct).state;
                if (past) {
                  if (id(rest_level_below_since) == 0) id(rest_level_below_since) = now;
                  unsigned long persist_ms =
                      (unsigned long)(id(rest_level_persist_s).state * 1000.0f);
                  bool gap_ok = (id(rest_last_pulse_ms) == 0)
                             || (now - id(rest_last_pulse_ms)) >= REST_GAP_MS;
                  if ((now - id(rest_level_below_since)) >= persist_ms && gap_ok) {
                    bool slave_high = id(level_err_filt) > 0.0f;
                    bool at_or_below = id(lift_pct) <= lift_sp;
                    int want = at_or_below ? (slave_high ? 1 : 2)   // feed LOW
                                           : (slave_high ? 3 : 4);  // vent HIGH
                    id(rest_pulse) = want;
                    id(rest_pulse_since) = now;
                    id(rest_pulse_air_since) = 0;
                    id(rest_pulse_start_angle) =
                        (want == 1 || want == 4) ? id(current_angle) : id(current_angle2);
                    id(rest_level_below_since) = 0;
                    // ensure visit is Lift before counting (supervisor may run before maintain tick)
                    if (id(visit_pos) != 1) {
                      id(visit_pos) = 1;
                      id(visit_height_count) = 0;
                      id(visit_level_count) = 0;
                    }
                    id(visit_level_count)++;
                    const char* what = want == 1 ? "FEED master" : want == 2 ? "FEED slave"
                                     : want == 3 ? "VENT slave" : "VENT master";
                    ESP_LOGW("level", "REST-LEVEL: %s (err %+.1f%%, h %.1f%%) visit level #%d",
                             what, id(level_err_filt), id(lift_pct), id(visit_level_count));
                  }
                } else {
                  id(rest_level_below_since) = 0;
                }
              } else {
                id(rest_level_below_since) = 0;
                if (!at_lift_only && id(rest_pulse) != 0) {
                  id(rest_pulse) = 0;
                  id(rest_pulse_air_since) = 0;
                }
              }
            }
          }
          // ================ end leveling supervisor ================

          // ---- valve command-vs-feedback agreement (manual-operation detector; DISPLAY ONLY) ----
          // rev I: no travel-time knob — the CR5-02 end-stops are direct evidence.
          // "Commanded" = what we're driving Y2 to (valve_power_open); in bench mode
          // that's the hand switch. Two independent tells, fixed constants:
          //   · WRONG end-stop once the valve should have left its old seat -> manual
          //   · neither contact (still MOVING) far past worst-case travel (~7 s open /
          //     ~2.3 s close) -> stuck/slow or hand-cranked off a seat; same flag
          // 2 s persistence rejects seating chatter. both-on = contact fault (shown
          // by Valve Positions), not manual operation.
          {
            const unsigned long WRONG_STOP_GRACE_MS = 5000UL;   // time to leave the old seat
            const unsigned long TRAVEL_LIMIT_MS     = 15000UL;  // worst-case travel + margin
            bool vcmd_open = id(valve_power_open).state;
            if (vcmd_open != id(valve_cmd_open_prev)) {
              id(valve_cmd_open_prev) = vcmd_open;
              id(valve_cmd_since) = now;
            }
            bool vfo = id(valve_fb_open).state, vfc = id(valve_fb_closed).state;
            bool both_on = vfo && vfc;
            bool wrong_stop = vcmd_open ? (vfc && !vfo) : (vfo && !vfc);
            bool mid_travel = !vfo && !vfc;
            unsigned long since_cmd = now - id(valve_cmd_since);
            bool vbad = !both_on
                        && ((wrong_stop && since_cmd > WRONG_STOP_GRACE_MS)
                            || (mid_travel && since_cmd > TRAVEL_LIMIT_MS));
            if (vbad) { if (id(valve_disagree_since) == 0) id(valve_disagree_since) = now; }
            else      { id(valve_disagree_since) = 0; }
            id(valve_disagree) = id(valve_disagree_since) != 0
                                 && (now - id(valve_disagree_since)) > 2000UL;
          }

          // supervisor: a position-targeted (auto) move that loses trust -> STOP (manual stays live)
          {
            int sm = id(lift_state);
            if ((sm == ${S_RAISING} || sm == ${S_LOWERING}) && !id(manual_move) && !id(height_ok)) {
              id(lift_state) = ${S_HOLD};
              id(last_stop_reason) = "angle trust lost mid-move";
              ESP_LOGW("safety", "auto move lost both angle sources -> STOP");
            }
          }

          int s = id(lift_state);
          float pct = id(lift_pct);

          // ---- RAISING (blower + valve energized together since rev H) ----
          if (s == ${S_RAISING}) {
            // (Runtime backstop = the ABSOLUTE blower cap above; the old per-raise
            //  watchdog was redundant — the cap always tripped first.)
            // stall detector (armed only after grace window). FEED-AWARE —
            // when the master valve is throttled for leveling, all air goes to
            // the slave side, so progress is measured on whichever side is fed,
            // IN THAT SENSOR'S OWN SIGN (raising drives the angle toward the
            // 'up' cal, which is the negative direction on the real mounting).
            // The throttle-change code resets the tracker onto the newly fed side.
            {
              // Ganged progress follows the height authority. A throttle still
              // tracks the side that is actually being fed.
              bool track_port = (id(level_throttle) == 1)
                  || (id(level_throttle) == 0 && id(height_src) == 2);
              bool fed_valid = track_port ? id(angle2_valid) : id(angle_valid);
              float fed_angle = track_port ? id(current_angle2) : id(current_angle);
              float dir_span = track_port ? span2 : span;
              float dir = (dir_span >= 0.0f) ? 1.0f : -1.0f;
              if (fed_valid) {
                if ((fed_angle - id(last_progress_angle)) * dir >= id(stall_min_progress_deg).state) {
                  id(last_progress_angle) = fed_angle;
                  id(last_progress_time) = now;
                } else {
                  unsigned long grace_ms = (unsigned long)(id(stall_grace_seconds).state * 1000.0f);
                  unsigned long stall_ms = (unsigned long)(id(stall_timeout_seconds).state * 1000.0f);
                  if ((now - id(blower_on_since)) > grace_ms &&
                      (now - id(last_progress_time)) > stall_ms) {
                    id(enter_fault)->execute("stall_no_progress");
                  }
                }
              }
            }
            // ---- boat-presence classification (rev G): raise cycles ONLY ----
            // Time the first PRESENCE_WINDOW %-points of climb; three bands:
            //   >= Empty Raise Rate Min      -> EMPTY
            //   <= Heavy Boat Raise Rate Max -> HEAVY / Cobalt (tower)
            //   in between                   -> LIGHT / other boat
            // Leveling throttle bias (rev F.2): master-closed under-reads
            // (safe); slave-closed inflates master rate — ABORTS classification
            // (previous latch holds). Classifies once per raise.
            {
              const float PRESENCE_WINDOW = 15.0f;   // %-points timed before deciding
              if (!id(presence_classified) && id(level_throttle) == 2) {
                id(presence_classified) = true;      // master rate inflated -> unusable
                ESP_LOGI("presence", "slave-side throttle mid-window -> classification aborted (latch holds)");
              }
              if (!id(presence_classified) && !id(manual_move) && id(height_ok)
                  && !std::isnan(pct) && !std::isnan(id(presence_start_pct))) {
                float climb = pct - id(presence_start_pct);
                if (climb >= PRESENCE_WINDOW) {
                  float dt = (now - id(move_start_ms)) / 1000.0f;
                  float rate = (dt > 0.5f) ? (climb / dt) : 0.0f;
                  bool empty = rate >= id(empty_raise_rate_min).state;
                  bool heavy = !empty && rate <= id(heavy_raise_rate_max).state;
                  id(presence_classified) = true;
                  id(boat_present) = !empty;
                  id(boat_heavy) = empty ? false : heavy;
                  id(boat_load_known) = true;
                  const char* band = empty ? "EMPTY" : (heavy ? "COBALT/HEAVY" : "OTHER/LIGHT");
                  ESP_LOGI("presence", "raise %.1f%% in %.1fs = %.2f %%/s -> %s (heavy <= %.2f, empty >= %.2f)",
                           climb, dt, rate, band,
                           id(heavy_raise_rate_max).state, id(empty_raise_rate_min).state);
                }
              }
              // Recompute shutoff after this tick's verdict, then retarget Lift.
              // Empty may raise the target mid-move; any boat / unknown stays
              // on the boat ceiling (fail-safe).
              if (id(height_src) == 1 || id(height_src) == 2) {
                float frac = id(top_target_pct).state / 100.0f;
                float boat_tgt = id(top_target_pct).state;
                float empty_tgt = boat_tgt;
                bool port_h = id(height_src) == 2;
                float cal_up = port_h ? id(cal2_angle_up) : id(cal_angle_up);
                float cal_down = port_h ? id(cal2_angle_down) : id(cal_angle_down);
                float cal_max = port_h ? id(cal2_angle_max) : id(cal_angle_max);
                bool max_done = port_h ? id(cal2_max_done) : id(cal_max_done);
                float spn = cal_up - cal_down;
                if (max_done && fabs(spn) > 0.5f)
                  empty_tgt = (cal_max - cal_down) / spn * 100.0f * frac;
                bool empty = id(boat_load_known) && !id(boat_present);
                id(lift_shutoff_pct) = empty ? empty_tgt : boat_tgt;
              }
              if (id(goto_mode) == ${M_LIFT} && !id(manual_move)
                  && !std::isnan(id(lift_shutoff_pct))
                  && fabs(id(goto_target_pct) - id(lift_shutoff_pct)) > 0.5f) {
                ESP_LOGI("presence", "Lift shutoff %.0f%% -> %.0f%% (%s)",
                         id(goto_target_pct), id(lift_shutoff_pct),
                         (id(boat_load_known) && !id(boat_present)) ? "empty" : "boat");
                id(goto_target_pct) = id(lift_shutoff_pct);
              }
            }
            // target stop: calibrated angle (no hardware top-limit fitted)
            if (id(lift_state) == ${S_RAISING}) {  // re-check: may have faulted above
              bool reached = false;
              if (id(goto_mode) == ${M_LOWER} && id(pos_at_lowered)) reached = true;
              else if (id(goto_mode) == ${M_READY} && id(pos_at_ready)) reached = true;
              else if (id(goto_mode) == ${M_GUIDE} && id(pos_at_guide)) reached = true;
              else if (id(height_ok) && !std::isnan(pct) && pct >= id(goto_target_pct)) reached = true;
              // Two-sided completion: master at target, but the slave must be
              // inside the level band too — the throttle (master valve closed)
              // feeds the slave while the master holds. Times out to FAULT.
              if (reached && id(auto_level_switch).state && id(level_ok_now)
                  && !id(manual_move)
                  && fabs(id(level_err_filt)) > id(level_deadband_pct).state) {
                if (id(level_catchup_start) == 0) {
                  id(level_catchup_start) = now;
                  ESP_LOGI("fsm", "raise: master at target, waiting on slave (err %.1f%%)",
                           id(level_err_filt));
                }
                if ((now - id(level_catchup_start)) >
                    (unsigned long)(id(level_catchup_timeout_s).state * 1000.0f)) {
                  id(start_emergency_descent)->execute("level_fail_catchup");
                }
                reached = false;   // keep the move alive; throttle feeds the lagging side
              }
              if (reached && id(lift_state) == ${S_RAISING}) {
                id(lift_state) = ${S_HOLD};
                id(level_catchup_start) = 0;
                id(last_stop_reason) = "raise target reached";
                ESP_LOGI("fsm", "raise target reached -> HOLD");
              }
            }
          }

          // ---- LOWERING (passive; angle stops early, timer backstops) ----
          else if (s == ${S_LOWERING}) {
            bool at_target = false;
            if (id(goto_mode) == ${M_LOWER} && id(pos_at_lowered)) at_target = true;
            else if (id(goto_mode) == ${M_READY} && id(pos_at_ready)) at_target = true;
            else if (id(goto_mode) == ${M_GUIDE} && id(pos_at_guide)) at_target = true;
            else if (id(height_ok) && !std::isnan(pct) && pct <= id(goto_target_pct)) at_target = true;
            unsigned long lt_ms = (unsigned long)(id(lower_timeout_minutes).state * 60000.0f);
            if (at_target) {
              if (id(goto_mode) == ${M_LOWER}) {
                // Lowered target: do NOT seal the valves — rest in LOWERED_VENT so the
                // tanks keep venting and the lift settles as far down as it physically
                // goes, indefinitely. Both sides reach bottom, so no level gate here.
                id(lift_state) = ${S_LOWERED_VENT};
                id(level_catchup_start) = 0;
                id(last_stop_reason) = "lowered - vent left open";
                // floating: the boat can drive on/off here -> presence unknown = presumed ON
                if (!id(boat_present)) ESP_LOGI("presence", "LOWERED_VENT -> presence reset to presumed BOAT ON");
                id(boat_present) = true;
                id(boat_heavy) = true;
                id(boat_load_known) = false;
                ESP_LOGI("fsm", "lowered threshold reached -> LOWERED_VENT (valves stay open)");
              } else {
                // Two-sided completion: master at target, slave must be level too
                // (throttle closes the master valve so only the lagging side vents).
                bool lvl_hold = false;
                if (id(auto_level_switch).state && id(level_ok_now) && !id(manual_move)
                    && fabs(id(level_err_filt)) > id(level_deadband_pct).state) {
                  if (id(level_catchup_start) == 0) {
                    id(level_catchup_start) = now;
                    ESP_LOGI("fsm", "lower: master at target, waiting on slave (err %.1f%%)",
                             id(level_err_filt));
                  }
                  if ((now - id(level_catchup_start)) >
                      (unsigned long)(id(level_catchup_timeout_s).state * 1000.0f)) {
                    id(start_emergency_descent)->execute("level_fail_catchup");
                  }
                  lvl_hold = true;
                }
                if (!lvl_hold && id(lift_state) == ${S_LOWERING}) {
                  id(lift_state) = ${S_HOLD};
                  id(level_catchup_start) = 0;
                  id(last_stop_reason) = "lower target reached";
                  ESP_LOGI("fsm", "lower target reached -> HOLD");
                }
              }
            } else if ((now - id(lower_start_time)) > lt_ms) {
              // backstop: descent never confirmed the target -> give up and seal
              id(lift_state) = ${S_HOLD};
              id(last_stop_reason) = (id(goto_mode) == ${M_LOWER})
                  ? "lower timeout (lowered zone never confirmed - valve closed)"
                  : "lower timeout";
              // A Lowered-bound descent may have reached floating depth
              // without ever confirming the zone — the boat could have changed,
              // so presence resets to presumed ON just like the LOWERED_VENT path.
              if (id(goto_mode) == ${M_LOWER}) {
                id(boat_present) = true;
                id(boat_heavy) = true;
                id(boat_load_known) = false;
              }
              ESP_LOGI("fsm", "lower timeout -> HOLD");
            }
          }

          // ---- EMERGENCY DESCENT (ADR-015): both valves open, blower off.
          //      Stage 1: ride to Ready. If list collapsed and is not growing,
          //      FAULT + seal. If residual list, still growing, or level trust
          //      lost → stage 2: continue to Lowered, then LOWERED_VENT +
          //      emerg_lock (vents stay open, Problem ON). Trust loss does NOT
          //      stop the descent. Timeout seals. Stop = seal now. ----
          else if (s == ${S_EMERG}) {
            unsigned long lt_ms = (unsigned long)(id(lower_timeout_minutes).state * 60000.0f);
            // now is sampled at the start of this 250 ms tick; start_emergency_descent
            // stamps lower_start_time with a later millis(). Unsigned subtract would
            // wrap and look like a 49-day timeout — same-tick inject then sealed
            // without ever leaving Lift (dock 2026-09-10).
            unsigned long started = id(lower_start_time);
            bool timed_out = (now >= started) && ((now - started) > lt_ms);
            if (id(goto_mode) == ${M_LOWER}) {
              if (id(pos_at_lowered)) {
                id(emerg_lock) = true;
                id(emerg_ready_since) = 0;
                id(lift_state) = ${S_LOWERED_VENT};
                id(last_stop_reason) = "EMERGENCY — lowered, vents open";
                if (!id(boat_present)) ESP_LOGI("presence", "EMERG LOWERED_VENT -> presence reset to presumed BOAT ON");
                id(boat_present) = true;
                id(boat_heavy) = true;
                id(boat_load_known) = false;
                ESP_LOGE("level", "EMERGENCY: arrived Lowered with residual list, vents left open");
              } else if (timed_out) {
                id(enter_fault)->execute("level_divergence - descent timeout, sealed");
              }
            } else {
              bool below_ready = id(height_ok) && !std::isnan(pct)
                                 && !std::isnan(id(ready_target_pct))
                                 && pct <= id(ready_target_pct);
              bool at_ready = id(pos_at_ready) || below_ready;
              if (at_ready) {
                const float WIN_PCT = 0.5f;
                bool residual = !lok || std::isnan(err_deg)
                                || err_deg > id(tilt_critical_deg).state;
                if (residual) {
                  id(goto_mode) = ${M_LOWER};
                  id(lower_start_time) = now;
                  id(emerg_ready_since) = 0;
                  ESP_LOGE("level", "EMERGENCY: residual list at Ready (%.1f deg) — continuing to Lowered",
                           err_deg);
                } else {
                  if (id(emerg_ready_since) == 0) {
                    id(emerg_ready_since) = now;
                    id(emerg_ready_err) = id(level_err_filt);
                  }
                  if ((now - id(emerg_ready_since)) >= 2000UL) {
                    bool growing = fabs(id(level_err_filt))
                                   > fabs(id(emerg_ready_err)) + WIN_PCT;
                    if (growing) {
                      id(goto_mode) = ${M_LOWER};
                      id(lower_start_time) = now;
                      id(emerg_ready_since) = 0;
                      ESP_LOGE("level", "EMERGENCY: list still growing at Ready — continuing to Lowered");
                    } else {
                      id(enter_fault)->execute("level_divergence - descended, sealed at Ready");
                    }
                  }
                }
              } else {
                id(emerg_ready_since) = 0;
                if (timed_out)
                  id(enter_fault)->execute("level_divergence - descent timeout, sealed");
              }
            }
          }

          // ---- resting at the bottom: vent stays open unless Stop sealed it.
          //      ADR-018: a power-up frame must not open the valves. Re-entry
          //      needs 20 s of calm list AND both sides in Lowered, neither in
          //      Guide. If both valid IMUs then read "not lowered" for 2 s, and
          //      this is not an emergency lock, the vents close. After the gate is
          //      open, Stop at the true bottom is still a no-op. A timed-out
          //      lower that later settles in re-enters the same way. ----
          else if (s == ${S_LOWERED_VENT} && !id(emerg_lock)) {
            float tol_deg = id(zone_tol_deg).state;
            bool stbd_lowered = id(cal_down_done) && id(angle_valid)
                && id(current_angle) > (id(cal_angle_down) - tol_deg);
            bool port_lowered = id(cal2_down_done) && id(angle2_valid)
                && id(current_angle2) > (id(cal2_angle_down) - tol_deg);
            std::uint32_t absent = static_cast<std::uint32_t>(id(lowered_absent_since));
            if (ultralift::lowered_reading_gone(id(angle_valid), stbd_lowered,
                                                id(angle2_valid), port_lowered,
                                                static_cast<std::uint32_t>(now), absent)) {
              id(lowered_absent_since) = 0;
              id(lift_state) = ${S_HOLD};
              id(last_stop_reason) = "not lowered — valves closed";
              ESP_LOGW("fsm", "LOWERED_VENT but neither IMU is lowered -> HOLD");
            } else {
              id(lowered_absent_since) = absent;
            }
          }
          else if (s == ${S_HOLD} && id(level_settle_vent) && !id(lowered_vent_stopped)) {
            float tol_deg = id(zone_tol_deg).state;
            bool stbd_lowered = id(cal_down_done) && id(angle_valid)
                && id(current_angle) > (id(cal_angle_down) - tol_deg);
            bool port_lowered = id(cal2_down_done) && id(angle2_valid)
                && id(current_angle2) > (id(cal2_angle_down) - tol_deg);
            bool stbd_guide = id(cal_guide_done) && id(angle_valid)
                && fabsf(id(current_angle) - id(cal_angle_guide)) <= tol_deg;
            bool port_guide = id(cal2_guide_done) && id(angle2_valid)
                && fabsf(id(current_angle2) - id(cal2_angle_guide)) <= tol_deg;
            if (stbd_lowered && port_lowered && !stbd_guide && !port_guide) {
              id(lift_state) = ${S_LOWERED_VENT};
              id(boat_present) = true;
              id(boat_heavy) = true;
              id(boat_load_known) = false;
              id(last_stop_reason) = "at lowered - vent reopened";
              ESP_LOGI("fsm", "HOLD in Lowered zone -> LOWERED_VENT (vent stays open)");
            }
          }
          if (id(lift_state) != ${S_LOWERED_VENT}) id(lowered_absent_since) = 0;

          // ---- move timing (calibration runs + diagnostics) ----
          {
            int ps = id(prev_lift_state);
            int cs = id(lift_state);
            bool ps_rest = (ps == ${S_HOLD} || ps == ${S_LOWERED_VENT});
            bool cs_rest = (cs == ${S_HOLD} || cs == ${S_LOWERED_VENT});
            bool ps_move = (ps == ${S_RAISING} || ps == ${S_LOWERING});
            bool cs_move = (cs == ${S_RAISING} || cs == ${S_LOWERING});
            bool start_or_redirect = (ps_rest && cs_move) || (ps_move && cs_move && ps != cs);
            if (start_or_redirect) {
              id(move_start_ms) = now;
              id(move_start_angle) = id(height_angle);
              // arm the presence classifier on RAISE starts only (rev F) —
              // includes LOWERING→RAISING retarget reverse (fresh climb window)
              if (cs == ${S_RAISING} && !id(manual_move) && !std::isnan(id(lift_pct))) {
                id(presence_start_pct) = id(lift_pct);
                id(presence_classified) = false;
              } else {
                id(presence_start_pct) = NAN;
                id(presence_classified) = true;
              }
              ESP_LOGI("move", "%s %s angle=%.2f° mode=%d manual=%d",
                       (ps_move && ps != cs) ? "REDIRECT" : "START",
                       (cs == ${S_LOWERING}) ? "LOWER" : "RAISE",
                       id(height_angle), id(goto_mode), id(manual_move));
            }
            if (ps_move && cs_rest) {
              float dur = (now - id(move_start_ms)) / 1000.0f;
              id(last_move_duration_sec) = dur;
              ESP_LOGI("move", "END %.1fs  %.2f° -> %.2f°  mode=%d",
                       dur, id(move_start_angle), id(height_angle), id(goto_mode));
            }
            id(prev_lift_state) = cs;
          }

          // ---- HA Lift Ready blind: position is Lift Height %. Above 95%
          //      latches fully open until below 93%, absorbing small height drift.
          //      Unknown height keeps the last position. Opening/closing only
          //      for user Lift/Ready moves and emergency descent. A Lower from
          //      the select/button is not this entity — leave operation idle.
          {
            const float pos = ultralift::cover_position(
                id(lift_pct), id(height_ok),
                id(lift_ready_cover).position, id(cover_fully_raised));
            cover::CoverOperation op = cover::COVER_OPERATION_IDLE;
            int cs0 = id(lift_state);
            if (cs0 == ${S_EMERG}) {
              op = cover::COVER_OPERATION_CLOSING;
            } else if (id(user_cmd_move)
                       && (cs0 == ${S_RAISING} || cs0 == ${S_LOWERING})) {
              if (id(goto_mode) == ${M_LIFT})       op = cover::COVER_OPERATION_OPENING;
              else if (id(goto_mode) == ${M_READY}) op = cover::COVER_OPERATION_CLOSING;
            }
            if (id(lift_ready_cover).position != pos
                || id(lift_ready_cover).current_operation != op) {
              id(lift_ready_cover).position = pos;
              id(lift_ready_cover).current_operation = op;
              id(lift_ready_cover).publish_state(false);
            }
          }
      # re-assert outputs from (possibly updated) state every tick
      - script.execute: apply_outputs

  # ---- MAINTAIN HEIGHT observer + actuator ----
  # Measures wave amplitude + sag rate. Confirmed sag at Ready / Lift
  # fires a real top-up via do_goto when Maintain Height is ON. No sticky lockout.
  # Per-visit counters reset when arriving at a new maintained position.
  - interval: 250ms
    then:
      - lambda: |-
          unsigned long now = millis();
          float pct = id(lift_pct);   // single-source height % (250 ms supervisor)
          bool good = id(height_ok) && !std::isnan(pct);

          // ---- wave-stripping EMA + 60 s peak-to-peak window ----
          if (good) {
            float tau = id(maintain_smoothing_seconds).state;
            float a = (tau > 0.0f) ? (0.25f / tau) : 1.0f;   // dt = 0.25 s
            if (a > 1.0f) a = 1.0f;
            if (id(obs_height_filt) < -900.0f) id(obs_height_filt) = pct;
            id(obs_height_filt) = a * pct + (1.0f - a) * id(obs_height_filt);
            if (pct < id(obs_win_min)) id(obs_win_min) = pct;
            if (pct > id(obs_win_max)) id(obs_win_max) = pct;
          }
          if (id(obs_win_start) == 0) id(obs_win_start) = now;
          if (now - id(obs_win_start) >= 60000UL) {
            id(obs_wave_pp) = (id(obs_win_max) > -900000.0f)
                              ? (id(obs_win_max) - id(obs_win_min)) : 0.0f;
            id(obs_win_min) = 1000000.0f; id(obs_win_max) = -1000000.0f;
            id(obs_win_start) = now;
          }

          // ---- sag rate (%/h) from the filtered height, sampled every 60 s ----
          // Resting HOLD only. A commanded raise/lower is not sag — carrying
          // that slope into the first parked tick false-trips Air Loss (Ready
          // arrival 2026-09-06: 149 s descent → "sag rate high", cleared 3 min).
          bool sag_rest = (id(lift_state) == ${S_HOLD});
          if (good && sag_rest && id(obs_height_filt) > -900.0f) {
            if (id(obs_rate_last_t) == 0) {
              id(obs_rate_last_t) = now; id(obs_rate_last_h) = id(obs_height_filt);
            } else if (now - id(obs_rate_last_t) >= 60000UL) {
              float dt_h = (now - id(obs_rate_last_t)) / 3600000.0f;
              if (dt_h > 0.0f) id(obs_sag_rate) = (id(obs_height_filt) - id(obs_rate_last_h)) / dt_h;
              id(obs_rate_last_t) = now; id(obs_rate_last_h) = id(obs_height_filt);
            }
          } else if (!sag_rest) {
            id(obs_rate_last_t) = 0;
            id(obs_sag_rate) = 0.0f;
          }

          // ---- AIR LOSS ALERT (§15.5 — visibility only; NEVER actuates) ----
          // "Any sink is a symptom." Three tells, all tunable:
          //   A) sinking while sealed: filtered height fell > Air Alert Sealed Drop
          //      in 30 s with both valves commanded closed (60 s settle grace after
          //      sealing; event latches the alert ~30 min). Seal failure, manually
          //      opened valve, or the §14.2 compression spiral.
          //   B) parked sag rate beyond Air Alert Sag Rate (downward) — same 60 s
          //      post-seal grace so a finished go-to is not an alert.
          //   C) top-ups + level fixes this visit reach Air Alert Visit Events.
          // Keepers keep correcting regardless (ADR-004) — this is the "and you
          // should know about it" layer. HA alerts on the Air Loss Alert binary.
          {
            bool sealed = !id(valve_power_open).state && !id(valve_power_open_b).state
                          && !id(test_mode);
            if (!sealed) { id(seal_ref_filt) = -999.0f; id(seal_since) = 0; }
            else {
              if (id(seal_since) == 0) { id(seal_since) = now; id(seal_ref_filt) = -999.0f; }
            }
            bool seal_settled = sealed && id(seal_since) != 0
                                && (now - id(seal_since)) > 60000UL;
            if (seal_settled && good && id(obs_height_filt) > -900.0f) {
              if (id(seal_ref_filt) < -900.0f) {
                id(seal_ref_filt) = id(obs_height_filt); id(seal_ref_ms) = now;
              } else if (now - id(seal_ref_ms) >= 30000UL) {
                float drop = id(seal_ref_filt) - id(obs_height_filt);
                if (drop > id(air_drop_alert_pct).state) {
                  id(air_alert_latch_ms) = now;
                  ESP_LOGE("airloss", "SINKING WHILE SEALED: %.1f%% in 30 s (limit %.1f%%) at %.1f%%",
                           drop, id(air_drop_alert_pct).state, id(obs_height_filt));
                }
                id(seal_ref_filt) = id(obs_height_filt); id(seal_ref_ms) = now;
              }
            }
            bool parked = (id(lift_state) == ${S_HOLD}) && id(visit_pos) != 0;
            bool a = id(air_alert_latch_ms) != 0
                     && (now - id(air_alert_latch_ms)) < 1800000UL;
            bool b = parked && seal_settled
                     && (id(obs_sag_rate) < -id(air_sag_alert_rate).state);
            bool c = parked && (id(visit_height_count) + id(visit_level_count))
                               >= (int) id(air_visit_alert_count).state;
            bool on = a || b || c;
            if (on && !id(air_alert)) {
              id(air_alert_reason) = a ? "sinking while sealed"
                                   : (b ? "sag rate high" : "frequent interventions");
              ESP_LOGW("airloss", "AIR LOSS ALERT: %s", id(air_alert_reason).c_str());
            } else if (!on && id(air_alert)) {
              id(air_alert_reason) = "";
              ESP_LOGI("airloss", "air loss alert cleared");
            }
            id(air_alert) = on;
          }

          // ---- visit + height-arm at Ready / Lift ----
          float ready_pct = id(ready_target_pct);
          bool at_top   = good && id(pos_at_top);
          bool at_ready = good && id(pos_at_ready);
          int zone = at_top ? 1 : (at_ready ? 2 : 0);
          int s = id(lift_state);
          bool resting = (s == ${S_HOLD});
          int prev_maintain_block = id(maintain_block_reason);
          id(maintain_block_reason) = 0;
          // Start/reset visit when we arrive HOLD at a maintained zone different
          // from the current visit. Top-up raises leave HOLD briefly but keep
          // visit_pos so counters survive the automatic recovery.
          if (resting && zone != 0 && id(visit_pos) != zone) {
            id(visit_pos) = zone;
            id(visit_height_count) = 0;
            id(visit_level_count) = 0;
            ESP_LOGI("maintain", "visit start at %s",
                     zone == 1 ? "Lift" : "Ready");
          } else if (resting && zone == 0 && id(visit_pos) != 0) {
            ESP_LOGI("maintain", "visit end (left maintained zone)");
            id(visit_pos) = 0;   // counts frozen on Maintain Observe until next visit
          }

          // Height arm only while HOLD + trusted (rest-level pulse aborts on height sag above)
          if (id(rest_pulse) != 0 && good && id(obs_height_filt) > -900.0f && zone == 1) {
            float lift_sp = std::isnan(id(lift_shutoff_pct))
                          ? id(top_target_pct).state : id(lift_shutoff_pct);
            if (id(obs_height_filt) < lift_sp - id(maintain_sag_deadband).state) {
              ESP_LOGW("maintain", "height sag during rest pulse -> abort pulse, yield to height");
              id(rest_pulse) = 0;
            }
          }
          if (!resting || !good || id(rest_pulse) != 0) {
            id(obs_arm_mode) = 0; id(obs_settled_since) = 0;
            id(obs_below_since) = 0; id(obs_below_now) = false;
            return;
          }

          if (id(obs_arm_mode) == 0) {
            if (zone == 1) { id(obs_arm_mode) = 1; id(obs_settled_since) = now; id(obs_below_since) = 0; }
            else if (zone == 2) {
              if (id(boat_load_known) && id(boat_present)) {
                id(obs_arm_mode) = 2; id(obs_settled_since) = now; id(obs_below_since) = 0;
              } else {
                id(maintain_block_reason) = 1;
                if (prev_maintain_block != 1)
                  ESP_LOGW("maintain", "Ready recovery OFF: loaded boat not confirmed");
              }
            }
            return;
          }

          float setpoint = ready_pct;
          if (id(obs_arm_mode) == 1) {
            setpoint = std::isnan(id(lift_shutoff_pct))
                     ? id(top_target_pct).state : id(lift_shutoff_pct);
          }
          // Ready is the only maintained height close to the floating posture.
          // It requires a positive loaded classification and may only recover
          // inside the narrow band between sag deadband and the safe floor.
          if (id(obs_arm_mode) == 2) {
            float floor_drop = id(ready_recovery_floor_pct).state;
            float deadband = id(maintain_sag_deadband).state;
            if (!id(boat_load_known) || !id(boat_present)) {
              id(maintain_block_reason) = 1;
              id(obs_below_since) = 0;
              if (prev_maintain_block != 1)
                ESP_LOGW("maintain", "Ready recovery OFF: loaded boat no longer confirmed");
              return;
            }
            if (floor_drop <= deadband) {
              id(maintain_block_reason) = 3;
              id(obs_below_since) = 0;
              if (prev_maintain_block != 3)
                ESP_LOGE("maintain", "Ready recovery OFF: floor %.1f%% must exceed deadband %.1f%%",
                         floor_drop, deadband);
              return;
            }
            float safe_floor = setpoint - floor_drop;
            if (pct < safe_floor || (id(obs_height_filt) > -900.0f && id(obs_height_filt) < safe_floor)) {
              id(maintain_block_reason) = 2;
              id(obs_below_since) = 0;
              if (prev_maintain_block != 2)
                ESP_LOGE("maintain", "Ready recovery INHIBITED: live %.1f%% filtered %.1f%% below safe floor %.1f%%",
                         pct, id(obs_height_filt), safe_floor);
              return;
            }
          }
          unsigned long settle_ms = (unsigned long)(id(maintain_settle_seconds).state * 1000.0f);
          bool settled = (now - id(obs_settled_since)) >= settle_ms;
          bool below = settled && (id(obs_height_filt) > -900.0f)
                       && (id(obs_height_filt) < setpoint - id(maintain_sag_deadband).state);
          id(obs_below_now) = below;
          if (!below) { id(obs_below_since) = 0; return; }
          if (id(obs_below_since) == 0) id(obs_below_since) = now;
          unsigned long persist_ms = (unsigned long)(id(maintain_persist_seconds).state * 1000.0f);
          unsigned long gap_ms = (unsigned long)(id(maintain_min_interval_min).state * 60000.0f);
          bool gap_ok = (id(obs_last_shadow) == 0) || (now - id(obs_last_shadow)) >= gap_ms;
          if ((now - id(obs_below_since)) < persist_ms || !gap_ok) return;

          id(obs_shadow_count)++;
          id(obs_last_shadow) = now;
          id(obs_below_since) = 0;
          const char* where = id(obs_arm_mode) == 1 ? "Lift" : "Ready";
          ESP_LOGW("maintain", "top-up #%d at %s (filt %.1f%% < %.1f%% - %.1f)",
                   id(obs_shadow_count), where,
                   id(obs_height_filt), setpoint, id(maintain_sag_deadband).state);

          // Real top-up when Maintain Height is ON — no lockout; visit counter only.
          if (id(auto_maintain_switch).state && !id(test_mode) && id(lift_state) == ${S_HOLD}) {
            int md = (id(obs_arm_mode) == 1) ? ${M_LIFT} : ${M_READY};
            id(obs_act_count)++;
            id(visit_height_count)++;
            id(rest_pulse) = 0;   // height owns the move
            id(user_cmd_move) = false;   // keeper move — "Lift In Operation" stays OFF
            ESP_LOGW("maintain", "MAINTAIN HEIGHT actuate #%d -> raise to %s (%.1f%%) visit top-ups %d",
                     id(obs_act_count), where, setpoint, id(visit_height_count));
            id(do_goto)->execute(setpoint, md);
          }

  # ---------------------------------------------------------------------------
  #  Panel link (RS485) — STA emitter + CMD parser. Telemetry + intents ONLY.
  #  Protocol: boat_lift_link_protocol.md. The panel is a request/display
  #  terminal; every CMD is validated through the SAME request_* scripts a dock
  #  button uses, so nothing here can bypass the FSM or the safety supervisor.
  # ---------------------------------------------------------------------------
  # STA heartbeat -> panel (~2 Hz): state token + height + flags + water + human msg.
  - interval: 500ms
    then:
      - lambda: |-
          float pct = id(lift_pct);   // single-source height % (250 ms supervisor)
          bool have = id(height_ok);
          int s = id(lift_state);
          const char* st = "HOLDING";
          if (s == ${S_FAULT})              st = "FAULT";
          else if (s == ${S_EMERG} || id(emerg_lock)) st = "EMERG_DESCEND";
          else if (s == ${S_BYPASS})        st = "BYPASS";
          else if (s == ${S_RAISING})       st = "RAISING";
          else if (s == ${S_LOWERING})      st = "LOWERING";
          else if (s == ${S_LOWERED_VENT})  st = "LOWERED";   // resting, vent open
          else if (have && !std::isnan(pct)) {   // HOLD: resting position
            if (id(pos_at_guide))         st = "GUIDE";
            else if (id(pos_at_lowered))  st = "LOWERED";
            else if (id(pos_at_ready))    st = "READY";
            else if (id(pos_at_top))      st = "LIFTED";
            else if (!std::isnan(id(ready_target_pct)))
              st = (pct < id(ready_target_pct)) ? "BETWEEN_LOWERED_READY" : "BETWEEN_READY_LIFTED";
            else                          st = "HOLDING";
          }
          int hp = (have && !std::isnan(pct)) ? (int)lroundf(pct) : -1;
          float w = id(water_temp).state;
          char wbuf[16];
          if (std::isnan(w)) strcpy(wbuf, "nan"); else snprintf(wbuf, sizeof(wbuf), "%.1f", w);
          char buf[180];
          snprintf(buf, sizeof(buf), "STA v=1 st=%s h=%d prob=%d trust=%d water=%s msg=%s\n",
                   st, hp, id(lift_problem).state ? 1 : 0, id(height_ok) ? 1 : 0,
                   wbuf, id(lift_status_text).state.c_str());
          id(link_uart).write_str(buf);

  # CMD parser <- panel: assemble newline-terminated lines, map req=* to the
  # existing intent scripts (ignore-unknown). Same validation as a dock button.
  - interval: 50ms
    then:
      - lambda: |-
          static std::string line;
          while (id(link_uart).available()) {
            uint8_t c;
            if (!id(link_uart).read_byte(&c)) break;
            if (c == '\n' || c == '\r') {
              if (line.rfind("CMD", 0) == 0) {
                size_t p = line.find("req=");
                if (p != std::string::npos) {
                  std::string req = line.substr(p + 4);
                  size_t e = req.find(' ');
                  if (e != std::string::npos) req = req.substr(0, e);
                  ESP_LOGI("link", "RX CMD req=%s", req.c_str());
                  if      (req == "LIFT" || req == "TOP")              id(request_goto_top)->execute();
                  else if (req == "LIFT_MAX" || req == "MAX")          id(request_goto_top)->execute();
                  else if (req == "READY")      id(request_goto_ready)->execute();
                  else if (req == "GUIDE")      id(request_goto_guide)->execute();
                  else if (req == "LOWER" || req == "LOWERED")         id(request_goto_lowered)->execute();
                  else if (req == "STOP")       id(request_stop)->execute();
                  else if (req == "RESET")      id(request_stop)->execute();   // rev G: Stop = universal clear
                  else if (req == "BYPASS_ON")  id(enter_bypass)->execute();
                  else if (req == "BYPASS_OFF") id(exit_bypass)->execute();
                  else ESP_LOGW("link", "unknown req=%s", req.c_str());
                }
              }
              line.clear();
            } else if (line.size() < 120) {
              line.push_back((char) c);
            }
          }
