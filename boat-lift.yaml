          id(cal_guide_done) = true;
          float gt = id(zone_tol_deg).state;
          ESP_LOGI("cal", "GUIDE adjusted to %.2f deg (zone: %.2f .. %.2f)",
                   x, x - gt, x + gt);
  - platform: template
    name: "Cal ${side_slave} Angle — Guide"
    id: cal2_num_guide
    web_server: {sorting_group_id: group_advanced, sorting_weight: 75.5}
    min_value: -35
    max_value: 65
    step: 0.05
    unit_of_measurement: "°"
    entity_category: config
    lambda: 'return id(cal2_angle_guide);'
    set_action:
      - lambda: |-
          id(cal2_angle_guide) = x;
          id(cal2_guide_done) = true;
          ESP_LOGI("cal", "SLAVE GUIDE adjusted to %.2f deg", x);
  - platform: template
    name: "Cal ${side_slave} Angle — Lift"
    id: cal2_num_top
    web_server: {sorting_group_id: group_advanced, sorting_weight: 76}
    min_value: -35      # tightened 2026-07-18 (see master cal bounds)
    max_value: 65
    step: 0.05
    unit_of_measurement: "°"
    entity_category: config
    lambda: 'return id(cal2_angle_up);'
    set_action:
      - lambda: |-
          id(cal2_angle_up) = x;
          id(cal2_up_done) = true;
