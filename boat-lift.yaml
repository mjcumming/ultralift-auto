  - platform: template
    name: "Cal ${side_slave} Angle — Ready"
    id: cal2_num_ready
    web_server: {sorting_group_id: group_advanced, sorting_weight: 75}
    min_value: -35      # tightened 2026-07-18 (see master cal bounds)
