# =============================================================================
#  RS485 LINK BENCH TEST — Lift end (KinCony KC868-A16)        DIAGNOSTIC TOOL
# =============================================================================
#  Kept as a quick way to sanity-check the lift<->panel RS485 wire independent of
#  all app logic. Sends "PING-LIFT <n>" once a second and logs everything it
#  receives (UART debug). Flash both this and rs485-test-panel.yaml, watch logs:
#  each board should print the OTHER's pings (proves both directions).
#  Then re-flash the real boat-lift-cobalt.yaml.
#
#  Confirmed-good pins (verified 2026-06-22): RS485 GPIO13 (TX) / GPIO16 (RX),
#  9600 8N1, auto-direction transceiver (no DE pin). See boat_lift_link_protocol.md.
#  OTA:  esphome compile rs485-test-lift.yaml ; esphome upload rs485-test-lift.yaml --device <lift-ip>
# =============================================================================
substitutions:
  name: rs485-test-lift

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG          # UART0 (GPIO1/3) — separate from the RS485 UART below

wifi:
  networks:
    - ssid: !secret wifi_ssid_1
      password: !secret wifi_password_1
    - ssid: !secret wifi_ssid_2
      password: !secret wifi_password_2

api:

ota:
  - platform: esphome
    password: !secret ota_password    # must match the running boat-lift-cobalt fw for OTA

uart:
  - id: link_uart
    tx_pin: GPIO13
    rx_pin: GPIO16
    baud_rate: 9600
    debug:
      direction: BOTH
      dummy_receiver: true          # this UART has no other consumer; debug reads it
      after:
        delimiter: "\n"
      sequence:
        - lambda: UARTDebug::log_string(direction, bytes);

interval:
  - interval: 1s
    then:
      - lambda: |-
          static uint32_t n = 0; n++;
          char b[32];
          int len = snprintf(b, sizeof(b), "PING-LIFT %u\n", n);
          id(link_uart).write_array((const uint8_t *) b, len);
          ESP_LOGI("rs485", "sent PING-LIFT %u", n);
